<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대학교 모아보기</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66727f;
      --district: #ffffff;
      --map-water: #dfecef;
      --river: #dbeaf2;
      --point: #d64242;
      --panel: rgba(255, 255, 255, 0.92);
      --shadow: 0 16px 45px rgba(31, 48, 65, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(64, 126, 138, 0.13), transparent 28rem),
        linear-gradient(135deg, #eef4f0 0%, #f7f2ea 48%, #edf3f7 100%);
    }

    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 8px clamp(18px, 4vw, 56px) 8px;
    }

    h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); line-height: 1.12; letter-spacing: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      height: calc(100vh - 96px);
      min-height: 650px;
      padding: 0 clamp(18px, 4vw, 56px) 12px;
    }
    .map-wrap {
      position: relative;
      margin-top: 26px;
      min-height: 650px;
      border: 1px solid rgba(23, 33, 43, 0.1);
      background: rgba(226, 236, 238, 0.82);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: visible;
    }

    .map-reset-bg {
      cursor: pointer;
    }


    .region-tabs {
      position: absolute;
      top: -34px;
      left: 18px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      pointer-events: auto;
    }

    .region-tab {
      position: relative;
      min-width: 82px;
      height: 34px;
      margin-left: 0;
      padding: 8px 18px;
      border: 1px solid rgba(40, 93, 91, 0.24);
      border-bottom: 0;
      border-radius: 9px 9px 0 0;
      color: #335a59;
      background: rgba(191, 224, 216, 0.64);
      box-shadow: 0 7px 16px rgba(31, 48, 65, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.52);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }

    .region-tab.active {
      z-index: 2;
      height: 35px;
      transform: translateY(1px);
      color: #173f3e;
      background: rgba(123, 196, 181, 0.92);
      border-color: rgba(34, 101, 96, 0.32);
      box-shadow: 0 9px 18px rgba(31, 48, 65, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.62);
    }

    .region-tab.pending {
      color: rgba(54, 82, 82, 0.7);
      background: rgba(216, 231, 225, 0.78);
    }

    .line-picker {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      gap: 6px;
      width: 150px;
      max-width: calc(100% - 28px);
      padding: 10px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(23, 33, 43, 0.1);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(31, 48, 65, 0.13);
      backdrop-filter: blur(8px);
    }

    .line-button {
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.62);
      cursor: pointer;
      color: #263843;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(23, 33, 43, 0.1), 0 2px 8px rgba(31, 48, 65, 0.1);
    }

    .line-button.active {
      outline: 3px solid rgba(23, 33, 43, 0.24);
      outline-offset: 2px;
      background: #fff;
    }

    .line-icon { width: 72px; height: 24px; flex: 0 0 72px; }
    .line-name { flex: 1; text-align: left; white-space: nowrap; }
    .line-button svg { width: 72px; height: 24px; min-height: 0; display: block; }

    .favorite-picker {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 154px;
      max-width: calc(100% - 28px);
      padding-left: 10px;
      border-left: 1px solid rgba(87, 119, 119, 0.28);
    }

    .favorite-picker.visible {
      display: flex;
    }

    .favorite-title {
      margin: 0 0 5px;
      color: #263843;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }

    .favorite-button {
      --favorite-color: #6f7f85;
      width: 78px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 3px 8px 3px 0;
      border: 0;
      border-radius: 0 7px 7px 0;
      background: linear-gradient(90deg, transparent 0 5px, transparent 5px);
      color: #263843;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
      text-align: left;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .favorite-button:hover,
    .favorite-button:focus {
      color: var(--favorite-color);
      outline: none;
    }

    .favorite-button.active {
      color: #fff;
      background: var(--favorite-color);
      box-shadow: 0 8px 18px rgba(31, 48, 65, 0.16);
    }

    .favorite-tab {
      width: 5px;
      height: 23px;
      border-radius: 0 5px 5px 0;
      background: var(--favorite-color);
      box-shadow: 0 2px 6px rgba(31, 48, 65, 0.12);
      flex: 0 0 auto;
    }

    .favorite-button.active .favorite-tab {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: none;
    }

    .favorite-label {
      white-space: nowrap;
    }

    .landmark-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      color: #263843;
      background: rgba(255, 255, 255, 0.72);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(23, 33, 43, 0.1), 0 2px 8px rgba(31, 48, 65, 0.1);
    }

    .landmark-toggle.active {
      color: #263843;
      background: #fff;
      outline: 3px solid rgba(222, 168, 0, 0.28);
      outline-offset: 2px;
    }

    .landmark-star {
      color: #e0a900;
      font-size: 15px;
      line-height: 1;
    }

    .landmark-panel {
      position: absolute;
      top: 558px;
      left: 14px;
      z-index: 2;
      width: 150px;
      max-width: calc(100% - 28px);
      padding: 10px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(23, 33, 43, 0.1);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(31, 48, 65, 0.13);
      backdrop-filter: blur(8px);
    }

    svg { display: block; width: 100%; height: 100%; min-height: 650px; }

    .district {
      fill: var(--district);
      stroke: #cad8df;
      stroke-width: 0.5;
      opacity: 0.7;
      cursor: pointer;
      vector-effect: non-scaling-stroke;
    }

    .district:hover { opacity: 0.9; fill: #ffffff; }
    .district.active { fill: #ffffff; stroke: #627b86; stroke-width: 1.2; opacity: 1; }
    .district.dimmed { opacity: 0.24; }
    .district.national-region {
      fill: #ffffff;
      stroke: rgba(92, 116, 128, 0.82);
      stroke-width: 0.9;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 1;
    }
    .district.national-region:hover,
    .district.national-region.active {
      fill: #ffffff;
      opacity: 1;
    }
    .district.national-region.dimmed { opacity: 0.32; }
    .national-boundary {
      fill: none;
      stroke: rgba(92, 116, 128, 0.82);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .district.incheon-region {
      fill: var(--district);
      stroke: rgba(169, 190, 200, 0.46);
      stroke-width: 0.28;
      opacity: 0.62;
    }
    .district.incheon-region:hover { fill: #ffffff; opacity: 0.86; }
    .district.incheon-region.active { fill: #ffffff; stroke: rgba(89, 118, 128, 0.7); stroke-width: 0.56; opacity: 1; }
    .district.gyeonggi-region-part {
      stroke: rgba(169, 190, 200, 0.46);
      stroke-width: 0.28;
      opacity: 0.62;
    }
    .district.gyeonggi-region-part:hover { opacity: 0.86; }
    .district.gyeonggi-region-part.active {
      fill: #ffffff;
      stroke: rgba(89, 118, 128, 0.7);
      stroke-width: 0.56;
      opacity: 1;
    }
    .district.seoul-region {
      stroke: none;
    }
    .district.seoul-region.active {
      fill: #ffffff;
      stroke: none;
      opacity: 1;
    }
    .district-name-label {
      fill: rgba(78, 91, 100, 0.32);
      font-size: 24px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.54);
      stroke-width: 4px;
      pointer-events: none;
    }

    .district-name-badge {
      position: absolute;
      top: -32px;
      right: 18px;
      z-index: 4;
      min-width: 86px;
      height: 28px;
      padding: 5px 13px;
      border: 1px solid rgba(92, 114, 124, 0.18);
      border-radius: 6px;
      color: rgba(57, 70, 80, 0.72);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 18px rgba(31, 48, 65, 0.1);
      font-size: 13px;
      font-weight: 900;
      line-height: 17px;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .district-sign {
      pointer-events: none;
    }

    .district-sign line {
      display: none;
    }

    .district-sign rect {
      fill: rgba(255, 255, 255, 0.94);
      stroke: rgba(61, 78, 88, 0.24);
      stroke-width: 1;
      filter: drop-shadow(0 5px 10px rgba(31, 48, 65, 0.16));
      vector-effect: non-scaling-stroke;
    }

    .district-sign text {
      fill: rgba(38, 51, 61, 0.86);
      font-size: 14px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.65);
      stroke-width: 2px;
    }

    .pixel-guide {
      pointer-events: none;
    }

    .pixel-guide line {
      stroke: rgba(28, 43, 54, 0.72);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .pixel-guide text {
      fill: rgba(28, 43, 54, 0.86);
      font-size: 12px;
      font-weight: 800;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.78);
      stroke-width: 2px;
    }

    .seoul-outline {
      fill: none;
      stroke: #9fb0ba;
      stroke-width: 0.95;
      opacity: 0.48;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }
    .active-district-outline {
      fill: none;
      stroke: #526f7b;
      stroke-width: 3.1;
      opacity: 0.96;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .active-district-fill {
      fill: rgba(205, 228, 229, 0.72);
      stroke: none;
      pointer-events: none;
    }

    .island-inset-frame {
      fill: rgba(255, 255, 255, 0.76);
      stroke: rgba(95, 119, 132, 0.52);
      stroke-width: 1;
      filter: drop-shadow(0 8px 18px rgba(31, 48, 65, 0.14));
      vector-effect: non-scaling-stroke;
    }

    .island-inset-title {
      fill: rgba(38, 51, 61, 0.78);
      font-size: 13px;
      font-weight: 900;
      text-anchor: middle;
      pointer-events: none;
    }

    .island-inset-label {
      fill: rgba(38, 51, 61, 0.82);
      font-size: 11px;
      font-weight: 900;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 3px;
      pointer-events: none;
    }

    .gyeongsang-island-dot {
      fill: #ffffff;
      stroke: #9fb0ba;
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .region-inset-district {
      fill: var(--district);
      stroke: #9fb0ba;
      stroke-width: 0.65;
      opacity: 0.64;
      cursor: pointer;
      vector-effect: non-scaling-stroke;
    }

    .region-inset-district:hover,
    .region-inset-district.active {
      fill: #e8f2f3;
      stroke: #526f7b;
      stroke-width: 1.35;
      opacity: 0.96;
    }
    .jeju-inset .region-inset-district {
      fill: #ffffff;
      stroke: #9fb0ba;
      stroke-width: 0.65;
      opacity: 0.96;
    }
    .jeolla-land-gap {
      fill: #f8fbfc;
      stroke: none;
      opacity: 1;
      pointer-events: none;
    }
    .cheonan-boundary-eraser {
      fill: none;
      stroke: rgba(248, 250, 249, 0.98);
      stroke-width: 1.25;
      stroke-linecap: butt;
      stroke-linejoin: round;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .region-outline {
      fill: none;
      stroke: #6f8fc9;
      stroke-width: 2.5;
      opacity: 0.9;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .map-place-label {
      fill: rgba(82, 86, 90, 0.34);
      font-size: 18px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.74);
      stroke-width: 3px;
    }

    .map-place-label.major {
      fill: rgba(20, 24, 28, 0.92);
      font-size: 25px;
      font-weight: 900;
      stroke-width: 4px;
    }

    .river {
      fill: none;
      stroke: var(--river);
      stroke-width: 9;
      stroke-linecap: round;
      opacity: 0.34;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .landmark-river {
      fill: none;
      stroke: #49a9df;
      stroke-width: 11;
      stroke-linecap: round;
      opacity: 0.72;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .subway-line, .subway-halo {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .subway-line { stroke-width: 4.8; opacity: 0.88; }
    .subway-halo { stroke: rgba(255, 255, 255, 0.76); stroke-width: 8.8; }

    .uni-point {
      fill: var(--point);
      stroke: #fff;
      stroke-width: 1.8;
      cursor: pointer;
      transition: r 140ms ease, opacity 140ms ease, stroke-width 140ms ease;
      vector-effect: non-scaling-stroke;
    }

    .uni-point:hover, .uni-point:focus { stroke-width: 3; outline: none; }

    .landmark-point {
      fill: #e0a900;
      stroke: #fff;
      stroke-width: 1.7;
      cursor: pointer;
      vector-effect: non-scaling-stroke;
    }

    .landmark-point:hover, .landmark-point:focus { stroke-width: 3; outline: none; }

    .label-link {
      stroke: rgba(34, 49, 59, 0.68);
      stroke-width: 1.35;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .label {
      fill: #263843;
      font-size: 12px;
      font-weight: 800;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 3px;
      pointer-events: none;
    }

    .landmark-label {
      fill: #6b5100;
      font-size: 12px;
      font-weight: 900;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 3px;
      pointer-events: none;
    }

    .landmark-label-link {
      stroke: rgba(91, 72, 10, 0.62);
      stroke-width: 1.15;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    .tooltip {
      position: absolute;
      z-index: 3;
      max-width: 260px;
      padding: 10px 12px;
      color: #14212c;
      background: #fff;
      border: 1px solid rgba(23, 33, 43, 0.12);
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(25, 39, 51, 0.2);
      transform: translate(-50%, calc(-100% - 14px));
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .tooltip.visible { opacity: 1; }

    .district-inset {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: min(500px, calc(100% - 320px));
      min-width: 360px;
      padding: 13px;
      border: 1px solid rgba(48, 68, 78, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 20px 44px rgba(25, 39, 51, 0.22);
      transform: translate(-50%, -50%);
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }

    .district-inset h3 {
      margin: 0 36px 8px;
      color: #22323d;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
    }

    .district-inset-close {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(48, 68, 78, 0.16);
      border-radius: 5px;
      color: #334650;
      background: rgba(255, 255, 255, 0.82);
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .district-inset-close:hover, .district-inset-close:focus {
      background: #fff;
      outline: 2px solid rgba(39, 121, 110, 0.24);
      outline-offset: 1px;
    }

    .district-inset svg {
      width: 100%;
      height: 330px;
      min-height: 0;
      border-radius: 6px;
      background: rgba(245, 248, 246, 0.78);
      pointer-events: auto;
    }

    .district-inset.incheon-inset {
      width: min(820px, calc(100% - 120px));
      min-width: 620px;
    }

    .district-inset.incheon-inset svg {
      height: 560px;
    }

    .district-inset.national-inset {
      width: min(820px, calc(100% - 120px));
      min-width: 620px;
    }

    .district-inset.national-inset svg {
      height: 520px;
    }

    .inset-district {
      fill: #eef6f6;
      stroke: #6f8791;
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .inset-point {
      fill: var(--point);
      stroke: #fff;
      stroke-width: 1.8;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      pointer-events: auto;
    }

    .inset-point:hover, .inset-point:focus { stroke-width: 3; outline: none; }

    .inset-label-link {
      stroke: rgba(34, 49, 59, 0.58);
      stroke-width: 1.1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .inset-label {
      fill: #21313c;
      font-size: 12px;
      font-weight: 900;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 3px;
      cursor: pointer;
      pointer-events: auto;
    }

    .inset-empty {
      fill: rgba(70, 85, 95, 0.62);
      font-size: 13px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tooltip strong { display: block; font-size: 15px; line-height: 1.3; }
    .tooltip span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }

    aside { display: flex; flex-direction: column; min-height: 0; gap: 12px; }

    .map-search {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: min(280px, calc(100% - 190px));
      padding: 14px;
      background: var(--panel);
      border: 1px solid rgba(23, 33, 43, 0.1);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(31, 48, 65, 0.1);
      backdrop-filter: blur(8px);
    }

    label { display: block; margin-bottom: 7px; color: #344552; font-size: 13px; font-weight: 700; }
    input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #bfccd4; border-radius: 8px; color: var(--ink); background: #fff; font: inherit; font-size: 14px; }
    .map-search label + input + label { margin-top: 10px; }
    .department-results {
      display: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(23, 33, 43, 0.1);
    }
    .department-results.visible { display: block; }
    .department-results-title {
      margin: 0 0 7px;
      color: #344552;
      font-size: 12px;
      font-weight: 800;
    }
    .department-results-list {
      max-height: 360px;
      overflow: auto;
      display: grid;
      gap: 5px;
    }
    .department-result-button {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid rgba(23, 33, 43, 0.08);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.72);
      color: #263843;
      cursor: pointer;

      if (state.currentRegion === "gangwon") return gangwonUniversities;
      if (state.currentRegion === "chungcheong") return chungcheongUniversities;
      if (state.currentRegion === "gyeongsang") return gyeongsangUniversities;
      if (state.currentRegion === "jeolla") return jeollaUniversities;
      if (state.currentRegion === "national") {
        return [
          ...universities,
          ...gyeonggiUniversities,
          ...incheonUniversities,
          ...gangwonUniversities,
          ...chungcheongUniversities,
          ...gyeongsangUniversities,
          ...jeollaUniversities
        ];
      }
      return [];
    }

        mergeFeature("경기", gyeonggiFeatures),
        mergeFeature("강원", geos.gangwon?.features || []),
        mergeFeature("충청", geos.chungcheong?.features || []),
        mergeFeature("영남", (geos.gyeongsang?.features || []).filter(feature => !isGyeongsangInsetIsland(feature))),
        mergeFeature("호남", (geos.jeolla?.features || []).map(feature => isJejuFeature(feature) ? feature : cleanJeollaWestCoastIslands(feature)))
      ].filter(Boolean);
      return {

    function universityNationalRegion(d) {
      if (universities.includes(d)) return "서울";
      if (gyeonggiUniversities.includes(d) || incheonUniversities.includes(d)) return "경기";
      if (gangwonUniversities.includes(d)) return "강원";
      if (chungcheongUniversities.includes(d)) return "충청";
      if (gyeongsangUniversities.includes(d)) return "영남";
      if (jeollaUniversities.includes(d)) return "호남";

    function rewindNationalFeature(feature) {
      const geometry = feature?.geometry;
      if (!geometry) return feature;
      const reverseRing = ring => [...ring].reverse();
      const rewindGeometry = geometry.type === "Polygon"
        ? { ...geometry, coordinates: geometry.coordinates.map(reverseRing) }
        : geometry.type === "MultiPolygon"
          ? { ...geometry, coordinates: geometry.coordinates.map(polygon => polygon.map(reverseRing)) }
          : geometry;
      return { ...feature, geometry: rewindGeometry };

    function rewindNationalGeo(geo) {

    function normalizedGyeonggiDistrictName(name) {
      const cityPrefixes = ["수원시", "성남시", "안양시", "안산시", "고양시", "용인시"];

    function isIncheonFeature(feature) {

    function featurePolygons(feature) {
      const geometry = feature.geometry;

    function mergedDistrictFeature(name, features) {
      return {

    function groupDistrictFeatures(features) {
      const groups = new Map();
      features.forEach(feature => {
        const name = districtName(feature);
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(feature);
      });
      return [...groups].map(([name, items]) => mergedDistrictFeature(name, items));

    function chungcheongDisplayName(name) {
      if (["동구", "중구", "서구", "유성구", "대덕구"].includes(name)) return "대전시";

      if (["천안시동남구", "천안시서북구"].includes(name)) return "천안시";

    function districtName(d) {
      if (state.currentRegion === "national" && d?.properties?.REGION) return d.properties.REGION;
      if (d?.properties?.merged && d.properties.NAME_1 === "Incheon") return "인천";
      if (d?.properties?.sidonm === "인천광역시") return "인천";
      if (d?.properties?.sggnm) return normalizedGyeonggiDistrictName(d.properties.sggnm);
      const englishName = d.properties.NAME_2 || d.properties.name;
      const name = d.properties.SIG_KOR_NM || gyeonggiNameMap[englishName] || englishName || (state.currentRegion === "gyeonggi" ? "인천·경기" : "서울 자치구");

    function removeNationalJejuFromHonam(feature) {
      if (state.currentRegion !== "national" || feature?.properties?.name !== "호남") return feature;
      const geometry = feature.geometry;
      if (geometry.type !== "MultiPolygon") return feature;
      const polygons = geometry.coordinates.filter(polygon => {
        const [[minX, minY], [maxX, maxY]] = polygonBounds(polygon);
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        return !(cx > 125.8 && cx < 127.1 && cy > 33.0 && cy < 34.0);
      });
      return {
        ...feature,
        geometry: {
          ...geometry,
          coordinates: polygons.length ? polygons : geometry.coordinates
        }
      };
    }

    function cleanJeollaWestCoastIslands(feature) {
      if (state.currentRegion !== "jeolla" || isJejuFeature(feature)) return feature;
      const geometry = feature.geometry;
      if (geometry.type !== "MultiPolygon") return feature;
      const areas = geometry.coordinates.map(polygonBoundsArea);
      const largestIndex = areas.reduce((bestIndex, area, index) => (
        area > areas[bestIndex] ? index : bestIndex
      ), 0);
      const polygons = geometry.coordinates.filter((polygon, index) => {
        return index === largestIndex || areas[index] >= 0.008;
      });
      return {
        ...feature,
        geometry: {
          ...geometry,
          coordinates: polygons.length ? polygons : [geometry.coordinates[0]]
        }
      };
    }

    function cleanNationalInsetIslands(feature, schools) {
      if (state.currentRegion !== "national") return feature;
      const geometry = feature.geometry;
      if (geometry.type !== "MultiPolygon") return feature;
      if (feature.properties?.name === "호남") return feature;
      const schoolPoints = schools.map(d => [d.lon, d.lat]);
      const areas = geometry.coordinates.map(polygonBoundsArea);
      const largestArea = Math.max(...areas);
      const keep = geometry.coordinates.filter((polygon, index) => {
        if (areas[index] >= largestArea * 0.018) return true;
        const [[minX, minY], [maxX, maxY]] = polygonBounds(polygon);
        return schoolPoints.some(([lon, lat]) => lon >= minX && lon <= maxX && lat >= minY && lat <= maxY);
      });
      return {
        ...feature,
        geometry: {
          ...geometry,
          coordinates: keep.length ? keep : [geometry.coordinates[areas.indexOf(largestArea)]]
        }
      };
    }

    function pointXY(d) {
      const projection = (state.currentRegion === "jeolla" || isNationalJejuUniversity(d))
        && state.jejuInsetProjection
        && ["제주시", "서귀포시"].includes(d.district)

      const [x, y] = projection([d.lon, d.lat]);
      const offsetX = Number.isFinite(d._displayOffsetX) ? d._displayOffsetX : (d.offsetX || 0);
      const offsetY = Number.isFinite(d._displayOffsetY) ? d._displayOffsetY : (d.offsetY || 0);
      const manual = manualSpotOffset(d);
      return [x + offsetX + manual.x, y + offsetY + manual.y];

      return { type: "FeatureCollection", features: displayGyeonggiFeatures(state.geo, state.geos.seoul ? mergedDistrictFeature("서울", state.geos.seoul.features) : null) };

    function displayGyeonggiFeatures(geo, seoulFeature) {
      const cleanedFeatures = geo.features.filter(isDisplayDistrict);

      const groupedFeatures = groupDistrictFeatures(otherFeatures);

        geometry: {

      return [
        ...groupedFeatures,
        ...(seoulFeature ? [seoulFeature] : []),
        removeRemoteIncheonIslands(removeTinyIslands(incheonFeature))

    }

    function polygonBoundsArea(polygon) {
      const points = polygon.flat();
      const xs = points.map(point => point[0]);
      const ys = points.map(point => point[1]);
      return (Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys));
    }

    function polygonBounds(polygon) {
      const points = polygon.flat();
      const xs = points.map(point => point[0]);
      const ys = points.map(point => point[1]);
      return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
    }

    function removeTinyIslands(feature) {
      if (!isIncheonFeature(feature)) return feature;
      const geometry = feature.geometry;
      const minArea = 0.0028;
      if (geometry.type === "Polygon") return feature;
      if (geometry.type !== "MultiPolygon") return feature;
      const polygons = geometry.coordinates.filter(polygon => polygonBoundsArea(polygon) >= minArea);
      return {
        ...feature,
        geometry: {
          ...geometry,
          coordinates: polygons.length ? polygons : [geometry.coordinates[0]]
        }
      };
    }

    function polygonCentroidLatitude(polygon) {
      const points = polygon.flat();
      return d3.mean(points, point => point[1]);
    }

    function polygonCentroidLongitude(polygon) {
      const points = polygon.flat();
      return d3.mean(points, point => point[0]);
    }

    function removeRemoteIncheonIslands(feature) {
      if (!isIncheonFeature(feature)) return feature;
      const geometry = feature.geometry;
      if (geometry.type !== "MultiPolygon") return feature;
      const mainlandMinLongitude = 126.1;
      const polygons = geometry.coordinates.filter(polygon => polygonCentroidLongitude(polygon) >= mainlandMinLongitude);
      return {
        ...feature,
        geometry: {

        if (lonExtent.every(Number.isFinite) && latExtent.every(Number.isFinite)) {

    function removeIncheonInsetIslands(feature) {
      if (feature.properties.NAME_1 !== "Incheon") return feature;
      const geometry = feature.geometry;

      const minArea = 0.0028;

      const polygons = geometry.coordinates.filter(polygon =>

    function manualSpotOffset(d) {
      if (state.currentRegion !== "jeolla") return { x: 0, y: 0 };
      const offsets = {
        "광신대학교": { x: 0, y: 6 },
        "광주과학기술원": { x: 12, y: 12 },
        "남부대학교": { x: 4, y: 8 },

        "국립목포대학교": { x: 6, y: 0 },
        "초당대학교": { x: 4, y: 0 }
      };
      return offsets[d.name] || { x: 0, y: 0 };

    function preparePointOffsets(items) {
      const shouldSpread = ["gyeonggi", "chungcheong", "gyeongsang", "jeolla"].includes(state.currentRegion);
      items.forEach(d => {
        d._displayOffsetX = shouldSpread ? 0 : (d.offsetX || 0);
        d._displayOffsetY = shouldSpread ? 0 : (d.offsetY || 0);
      });
      if (!shouldSpread) return;
      const regionalDense = ["gyeongsang", "jeolla"].includes(state.currentRegion);
      const minDistance = state.currentRegion === "chungcheong" ? 9 : regionalDense ? 12 : 12;
      const maxOffset = state.currentRegion === "chungcheong" ? 4 : regionalDense ? 7 : 7;
      for (let iteration = 0; iteration < 70; iteration++) {
        let adjusted = false;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const a = items[i];
            const b = items[j];
            const [ax, ay] = pointXY(a);
            const [bx, by] = pointXY(b);
            let dx = ax - bx;
            let dy = ay - by;
            let distance = Math.hypot(dx, dy);
            if (distance >= minDistance) continue;
            if (distance < 0.01) {
              const angle = (i * 2.399 + j) % (Math.PI * 2);
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              distance = 1;
            }
            const push = (minDistance - distance) / 2 + 0.18;
            const ux = dx / distance;
            const uy = dy / distance;
            a._displayOffsetX = clamp(a._displayOffsetX + ux * push, -maxOffset, maxOffset);
            a._displayOffsetY = clamp(a._displayOffsetY + uy * push, -maxOffset, maxOffset);
            b._displayOffsetX = clamp(b._displayOffsetX - ux * push, -maxOffset, maxOffset);
            b._displayOffsetY = clamp(b._displayOffsetY - uy * push, -maxOffset, maxOffset);
            adjusted = true;
          }
        }
        if (!adjusted) break;
      }
    }

    function paddedBox(box, padding = 4) {

      const ccw = (p1, p2, p3) => (p3[1] - p1[1]) * (p2[0] - p1[0]) > (p2[1] - p1[1]) * (p3[0] - p1[0]);
      return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
    }

      if (pointInBox(a, box) || pointInBox(b, box)) return true;
      const corners = [[box.left, box.top], [box.right, box.top], [box.right, box.bottom], [box.left, box.bottom]];
      return corners.some((corner, index) => segmentsIntersect(a, b, corner, corners[(index + 1) % corners.length]));

      const avoidBox = paddedBox(box, 6);
      for (let i = 1; i < route.length; i++) {
        if (segmentIntersectsBox(route[i - 1], route[i], avoidBox)) return 180;
      }
      return 0;

          const gimhaePoints = activeUniversities()
            .filter(item => item.district === "\uae40\ud574\uc2dc")
            .map(item => pointXY(item))
            .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
          if (gimhaePoints.length) {

            const maxX = d3.max(gimhaePoints.map(([x]) => x));
            const minY = d3.min(gimhaePoints.map(([, y]) => y));

      const focusDistricts = new Set(["\uacbd\uc0b0\uc2dc", "\ubd80\uc0b0\uc2dc", "\uad11\uc8fc\uc2dc"]);

      const peers = activeUniversities()
        .filter(item => item.district === d.district)
        .slice()
        .sort((a, b) => b.lat - a.lat || a.lon - b.lon || a.name.localeCompare(b.name));
      if (peers.length < 2) return null;
      const centerLon = d3.mean(peers, item => item.lon);
      const side = d.lon < centerLon ? "left" : "right";
      const sidePeers = peers.filter(item => (item.lon < centerLon ? "left" : "right") === side);

      const spacing = d.district === "\ubd80\uc0b0\uc2dc" ? 18 : 20;
      const dy = (index - (sidePeers.length - 1) / 2) * spacing;
      return {
        dx: side === "left" ? -distance : distance,
        dy,
        anchor: side === "left" ? "end" : "start"
      };

      const matches = state.mapGeo.features.filter(d => districtName(d) === name);

        const jejuMatches = state.geo.features.filter(d => districtName(d) === name);

        if (jejuMatches.length > 1) {
          return {
            type: "FeatureCollection",
            properties: { name, mergedDistrict: true },
            features: jejuMatches
          };
        }
      }
      if (!matches.length) return null;
      if (matches.length === 1) return matches[0];
      return {
        type: "FeatureCollection",
        properties: { name, mergedDistrict: true },
        features: matches
      };

        "\uad11\uc8fc\uc2dc": [at(0.50, 0.14), at(0.50, 0.86), at(0.14, 0.50), at(0.86, 0.50)]
      };
      const activePoints = currentFiltered()
        .filter(activeMatch)
        .map(d => ({ point: pointXY(d), label: d._label?.box }))
        .filter(item => Number.isFinite(item.point[0]) && Number.isFinite(item.point[1]));
      const candidates = [
        ...(preferred[name] || []),
        { x: clampX(cx), y: clampY(cy) },
        at(0.50, 0.50),
        at(0.30, 0.30),
        at(0.70, 0.30),
        at(0.30, 0.70),
        at(0.70, 0.70)
      ];
      let best = null;
      candidates.forEach((candidate, index) => {
        const box = signBoxAt(candidate.x, candidate.y, boxWidth, boxHeight);
        const padded = paddedBox(box, 6);
        const pointPenalty = activePoints.reduce((sum, item) => sum + (pointInBox(item.point, padded) ? 900 : 0), 0);
        const labelPenalty = activePoints.reduce((sum, item) => sum + (item.label ? overlapArea(padded, paddedBox(item.label, 2)) * 20 : 0), 0);
        const boundsPenalty =
          Math.max(0, x0 - box.left) * 6 +
          Math.max(0, box.right - x1) * 6 +
          Math.max(0, y0 - box.top) * 6 +
          Math.max(0, box.bottom - y1) * 6;
        const centerPenalty = Math.hypot(candidate.x - cx, candidate.y - cy) * 0.03;
        const score = pointPenalty + labelPenalty + boundsPenalty + centerPenalty + index * 8;
        if (!best || score < best.score) best = { ...candidate, score };
      });
      return best || { x: clampX(cx), y: clampY(cy) };
    }

          const geometry = feature.geometry;
          if (geometry?.type !== "MultiPolygon") return feature;
          const areas = geometry.coordinates.map(polygonBoundsArea);
          const largestIndex = areas.reduce((bestIndex, area, index) => area > areas[bestIndex] ? index : bestIndex, 0);
          const polygons = geometry.coordinates.filter((polygon, index) => index === largestIndex || areas[index] >= 0.008);
          return {
            ...feature,
            geometry: {
              ...geometry,
              coordinates: polygons.length ? polygons : [geometry.coordinates[0]]
            }
          };
        });

    function spreadInsetPoints(points, width, height, minDistance = 18) {
      for (let iteration = 0; iteration < 80; iteration++) {
        let adjusted = false;
        for (let i = 0; i < points.length; i++) {
          for (let j = i + 1; j < points.length; j++) {
            const a = points[i];
            const b = points[j];
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let distance = Math.hypot(dx, dy);
            if (distance >= minDistance) continue;
            if (distance < 0.01) {
              const angle = (i * 2.399 + j) % (Math.PI * 2);
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              distance = 1;
            }
            const push = (minDistance - distance) / 2 + 0.35;
            const ux = dx / distance;
            const uy = dy / distance;
            a.x = clamp(a.x + ux * push, 12, width - 12);
            a.y = clamp(a.y + uy * push, 18, height - 12);
            b.x = clamp(b.x - ux * push, 12, width - 12);
            b.y = clamp(b.y - uy * push, 18, height - 12);
            adjusted = true;
          }
        }
        if (!adjusted) break;
      }
      return points;
    }

    function insetLabelBox(x, y, width, anchor) {
      const left = anchor === "end" ? x - width : anchor === "middle" ? x - width / 2 : x;
      return { left, right: left + width, top: y - 11, bottom: y + 5 };
    }

    function layoutInsetLabels(points, width, height) {
      const candidates = [
        { dx: 12, dy: -10, anchor: "start" },
        { dx: 12, dy: 16, anchor: "start" },
        { dx: -12, dy: -10, anchor: "end" },
        { dx: -12, dy: 16, anchor: "end" },
        { dx: 0, dy: -25, anchor: "middle" },
        { dx: 0, dy: 32, anchor: "middle" },
        { dx: 30, dy: 0, anchor: "start" },
        { dx: -30, dy: 0, anchor: "end" },
        { dx: 28, dy: -24, anchor: "start" },
        { dx: -28, dy: -24, anchor: "end" },
        { dx: 28, dy: 32, anchor: "start" },
        { dx: -28, dy: 32, anchor: "end" },
        { dx: 52, dy: -4, anchor: "start" },
        { dx: -52, dy: -4, anchor: "end" },
        { dx: 52, dy: 24, anchor: "start" },
        { dx: -52, dy: 24, anchor: "end" }
      ];
      const placed = [];
      return points
        .slice()
        .sort((a, b) => a.y - b.y || a.x - b.x)
        .map(point => {
          const text = labelText(point);
          const textWidth = Math.max(42, text.length * 10.5);
          let best = null;
          candidates.forEach((candidate, index) => {
            const x = clamp(point.x + candidate.dx, 12, width - 12);
            const y = clamp(point.y + candidate.dy, 18, height - 12);
            const box = insetLabelBox(x, y, textWidth, candidate.anchor);
            const boundsPenalty =
              Math.max(0, 10 - box.left) * 18 +
              Math.max(0, box.right - (width - 10)) * 18 +
              Math.max(0, 10 - box.top) * 18 +
              Math.max(0, box.bottom - (height - 10)) * 18;
            const overlapPenalty = placed.reduce((sum, item) => sum + overlapArea(box, item.box) * 18, 0);
            const pointPenalty = points.reduce((sum, item) => {
              if (item.name === point.name) return sum;
              return sum + (pointInBox([item.x, item.y], paddedBox(box, 5)) ? 360 : 0);
            }, 0);
            const distancePenalty = Math.hypot(candidate.dx, candidate.dy) * 0.25 + index * 0.3;
            const score = boundsPenalty + overlapPenalty + pointPenalty + distancePenalty;
            if (!best || score < best.score) best = { ...point, labelX: x, labelY: y, anchor: candidate.anchor, box, score };
          });
          placed.push({ box: best.box });
          return best;
        });
    }

      inset.append("circle")
        .datum(dokdoFeature)
        .attr("class", "gyeongsang-island-dot")
        .attr("cx", dokdoX)
        .attr("cy", dokdoY)
        .attr("r", 3.8)
        .append("title")
        .text("독도");
      inset.append("text")
        .attr("class", "island-inset-label")
        .attr("x", ulleungX)
        .attr("y", ulleungY + 28)
        .text("울릉도");
      inset.append("text")
        .attr("class", "island-inset-label")
        .attr("x", dokdoX)
        .attr("y", dokdoY + 16)
        .text("독도");
    }

    function drawJejuInset(width, height) {
      if (!["jeolla", "national"].includes(state.currentRegion) || !state.geo) return;
      const jejuFeatures = state.currentRegion === "national"
        ? (state.nationalJejuGeo?.features || [])
        : state.geo.features.filter(isJejuFeature);
      if (!jejuFeatures.length) return;
      const jejuCollection = { type: "FeatureCollection", features: jejuFeatures };
      const boxWidth = state.currentRegion === "national" ? 164 : 210;
      const boxHeight = state.currentRegion === "national" ? 112 : 154;
      const x = state.currentRegion === "national" ? Math.max(18, width - 520) : Math.max(18, width - 410);
      const y = Math.max(48, height - boxHeight - 42);
      const inset = svg.append("g").attr("class", "jeju-inset");
      inset.append("rect")
        .attr("class", "island-inset-frame")
        .attr("x", x)
        .attr("y", y)
        .attr("width", boxWidth)
        .attr("height", boxHeight)
        .attr("rx", 6)
        .attr("ry", 6);
      inset.append("text")
        .attr("class", "island-inset-title")
        .attr("x", x + boxWidth / 2)
        .attr("y", y + 20)
        .text("제주");
      const topPadding = state.currentRegion === "national" ? 30 : 34;
      const sidePadding = state.currentRegion === "national" ? 22 : 18;
      state.jejuInsetProjection = d3.geoMercator().fitExtent([[x + sidePadding, y + topPadding], [x + boxWidth - sidePadding, y + boxHeight - 16]], jejuCollection);
      const insetPath = d3.geoPath(state.jejuInsetProjection);
      inset.selectAll("path")
        .data(jejuFeatures)
        .join("path")
        .attr("class", "region-inset-district")
        .classed("active", d => districtName(d) === state.activeDistrict)
        .attr("d", insetPath)
        .on("click", (event, d) => {
          if (state.currentRegion !== "national") selectDistrict(districtName(d));
        })
        .append("title")
        .text(d => state.currentRegion === "national" ? "제주" : districtName(d));
    }

    function selectLine(line) {
      state.landmarkMode = false;
      state.activeLine = state.activeLine === line ? null : line;
      state.activeDistrict = null;
      state.signOnlyDistrict = null;
      linePicker.selectAll(".line-button").classed("active", d => d === state.activeLine);
      drawSelectedRoute();
      applyFilter();
    }

    function selectDistrict(name) {
      state.signOnlyDistrict = null;
      state.activeDistrict = state.activeDistrict === name ? null : name;
      state.activeLine = null;
      linePicker.selectAll(".line-button").classed("active", false);
      drawSelectedRoute();
      applyFilter();
    }

    function resetMapSelection() {
      const hadSelection = state.activeLine || state.activeDistrict || state.signOnlyDistrict || state.activeFavorite || state.selectedUniversity;
      if (!hadSelection) return;
      state.activeLine = null;
      state.activeDistrict = null;
      state.signOnlyDistrict = null;
      state.activeFavorite = null;
      state.selectedUniversity = null;
      linePicker.selectAll(".line-button").classed("active", false);
      renderFavoritePicker();
      tooltip.classed("visible", false);
      drawSelectedRoute();
      applyFilter();
      renderDefaultPanel();
    }

    function toggleLandmarks() {
      if (state.currentRegion !== "seoul") return;
      state.landmarkMode = !state.landmarkMode;
      if (state.landmarkMode) {
        state.activeLine = null;
        state.activeDistrict = null;
        state.signOnlyDistrict = null;
        state.selectedUniversity = null;
        linePicker.selectAll(".line-button").classed("active", false);
        drawSelectedRoute();
      }
      applyFilter();
    }

    function miniLineSvg(name) {
      const color = lineMeta[name].color;
      return `<svg viewBox="0 0 72 24" aria-hidden="true">
        <line x1="8" y1="12" x2="64" y2="12" stroke="${color}" stroke-width="5" stroke-linecap="round"></line>
        <circle cx="18" cy="12" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"></circle>
        <circle cx="36" cy="12" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"></circle>
        <circle cx="54" cy="12" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"></circle>
      </svg>`;
    }

    function renderLinePicker() {
      linePicker.selectAll(".line-button")
        .data(Object.keys(lineMeta))
        .join("button")
        .attr("class", "line-button")
        .attr("type", "button")
        .attr("title", d => d)
        .attr("aria-label", d => `${d} 표시`)
        .html(d => `<span class="line-icon">${miniLineSvg(d)}</span><span class="line-name">${d}</span>`)
        .on("click", (event, d) => selectLine(d));
      updateLandmarkToggle();
    }

    function renderFavoritePicker() {
      favoritePicker.html(`<p class="favorite-title">즐겨찾기</p>`);
      favoritePicker.selectAll(".favorite-button")
        .data(favoriteGroups)
        .join("button")
        .attr("class", "favorite-button")
        .classed("active", d => d.key === state.activeFavorite)
        .attr("type", "button")
        .attr("aria-pressed", d => d.key === state.activeFavorite ? "true" : "false")
        .attr("aria-label", d => `${d.fullLabel} 표시`)
        .style("--favorite-color", d => d.color)
        .html(d => `<span class="favorite-tab" aria-hidden="true"></span><span class="favorite-label">${d.label}</span>`)
        .on("click", (event, d) => selectFavorite(d.key));
    }

    function selectFavorite(key) {
      if (state.currentRegion !== "national") return;
      state.activeFavorite = state.activeFavorite === key ? null : key;
      search.value = "";
      departmentSearch.value = "";
      departmentResults.classList.remove("visible");
      departmentResults.innerHTML = "";
      state.selectedUniversity = null;
      renderFavoritePicker();
      renderDefaultPanel();
      applyFilter();
    }

    function renderDefaultPanel() {
      if (state.currentRegion === "national") {
        const group = favoriteGroup();
        departmentPanel.innerHTML = `
          <h2>전국 대학 학과정보</h2>
          <p class="meta">서울·경기·강원·충청·영남·호남 권역별 대학 정보를 한 화면에서 확인할 수 있습니다.</p>
          <p class="department-empty">${group ? `${escapeHtml(group.fullLabel)}에 해당하는 대학 스팟이 전국지도에 표시됩니다.` : "학과를 검색하거나 왼쪽 즐겨찾기를 선택하면 해당 대학 스팟이 지도에 표시됩니다."}</p>
        `;
        return;
      }
      if (state.currentRegion === "gangwon") {
        departmentPanel.innerHTML = `
          <h2>강원권 대학 학과정보</h2>
          <p class="meta">강원권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "chungcheong") {
        departmentPanel.innerHTML = `
          <h2>충청권 대학 학과정보</h2>
          <p class="meta">충청권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "gyeongsang") {
        departmentPanel.innerHTML = `
          <h2>영남권 대학 학과정보</h2>
          <p class="meta">영남권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "jeolla") {
        departmentPanel.innerHTML = `
          <h2>호남권 대학 학과정보</h2>
          <p class="meta">호남권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "gyeonggi") {
        departmentPanel.innerHTML = `
          <h2>경기권 대학 학과정보</h2>
          <p class="meta">경기권 대학 목록과 학과정보가 서울 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      departmentPanel.innerHTML = `
        <h2>학과정보</h2>
        <p class="meta">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        <p class="department-empty">대학교 검색이나 학과 검색으로 지도 위 대학을 좁혀볼 수 있습니다.</p>
      `;
    }

    function updateRegionTabs() {
      regionTabs.forEach(tab => {
        const active = tab.dataset.region === state.currentRegion;
        tab.classList.toggle("active", active);
        tab.classList.toggle("pending", !active);
        if (active) {
          tab.setAttribute("aria-current", "page");
        } else {
          tab.removeAttribute("aria-current");
        }
      });
      linePicker.style("display", state.currentRegion === "seoul" ? null : "none");
      favoritePicker.classed("visible", state.currentRegion === "national");
      renderFavoritePicker();
      mapWrap.classList.toggle("region-gyeonggi", state.currentRegion === "gyeonggi");
      mapWrap.classList.toggle("region-gangwon", state.currentRegion === "gangwon");
      mapWrap.classList.toggle("region-chungcheong", state.currentRegion === "chungcheong");
      mapWrap.classList.toggle("region-gyeongsang", state.currentRegion === "gyeongsang");
      mapWrap.classList.toggle("region-jeolla", state.currentRegion === "jeolla");
      mainEl.classList.toggle("region-chungcheong", ["chungcheong", "gyeongsang", "jeolla"].includes(state.currentRegion));
    }

    function selectRegion(region) {
      if (!state.geos[region] || state.currentRegion === region) return;
      state.currentRegion = region;
      state.geo = state.geos[region];
      state.landmarkMode = false;
      state.activeLine = null;
      state.activeDistrict = null;
      state.signOnlyDistrict = null;
      state.activeFavorite = null;
      state.selectedUniversity = null;
      search.value = "";
      departmentSearch.value = "";
      departmentResults.classList.remove("visible");
      departmentResults.innerHTML = "";
      linePicker.selectAll(".line-button").classed("active", false);
      updateRegionTabs();
      updateLandmarkToggle();
      renderDefaultPanel();
      draw();
    }

    function draw() {
      if (!state.geo) return;
      const node = svg.node();
      const width = node.clientWidth || 900;
      const height = node.clientHeight || 620;
      const currentUniversities = activeUniversities();
      svg.attr("viewBox", `0 0 ${width} ${height}`);
      svg.selectAll("*:not(title):not(desc)").remove();

      const fitPadding = state.currentRegion === "gyeonggi" ? 34 : 30;
      const mapGeo = displayGeo();
      state.mapGeo = mapGeo;
      const fitGeo = gyeonggiFitFeature(mapGeo);
      const fitExtent = state.currentRegion === "national"
        ? [[40, fitPadding - 10], [width - 198, height - fitPadding + 10]]
        : state.currentRegion === "jeolla"
        ? [[-110, fitPadding - 18], [width - 206, height - fitPadding + 16]]
        : ["chungcheong", "gyeongsang"].includes(state.currentRegion)
        ? [[-30, fitPadding], [width - 178, height - fitPadding]]
        : [[fitPadding, fitPadding], [width - fitPadding, height - fitPadding]];
      state.projection = d3.geoMercator().fitExtent(fitExtent, fitGeo);
      state.path = d3.geoPath(state.projection);
      state.jejuInsetProjection = null;
      preparePointOffsets(currentUniversities);

      svg.append("rect")
        .attr("class", "map-reset-bg")
        .attr("width", width)
        .attr("height", height)
        .attr("fill", "var(--map-water)")
        .on("click", resetMapSelection);
      if (state.currentRegion === "seoul") {
        svg.append("path").datum(riverLine).attr("class", "river").attr("d", state.path);
      }
      state.districts = svg.append("g")
        .selectAll("path")
        .data(mapGeo.features)
        .join("path")
        .attr("class", d => `district${state.currentRegion === "national" ? " national-region" : districtName(d) === "서울" && state.currentRegion === "gyeonggi" ? " seoul-region" : isIncheonDistrictFeature(d) ? " incheon-region" : state.currentRegion === "gyeonggi" ? " gyeonggi-region-part" : ""}`)
        .attr("d", state.path)
        .on("click", (event, d) => {
          event.stopPropagation();
          selectDistrict(districtName(d));
        });
      state.districts.append("title").text(d => districtName(d));
      drawJeollaLandGapPatches();

      if (false && state.currentRegion === "national" && state.nationalBoundary) {
        svg.append("path")
          .datum(state.nationalBoundary)
          .attr("class", "national-boundary")
          .attr("d", state.path);
      }

      state.routeLayer = svg.append("g").attr("aria-label", "선택한 지하철 노선");
      svg.append("path")
        .datum({ type: "FeatureCollection", features: mapGeo.features.filter(d => !(state.currentRegion === "gyeonggi" && districtName(d) === "서울")) })
        .attr("class", "seoul-outline")
        .attr("d", state.path);
      state.activeDistrictFill = svg.append("path")
        .attr("class", "active-district-fill")
        .attr("display", "none");
      state.activeDistrictOutline = svg.append("path")
        .attr("class", "active-district-outline")
        .attr("display", "none");
      drawJejuInset(width, height);
      drawGyeongsangIslandInset(width, height);
      state.landmarkRiver = svg.append("path").datum(riverLine).attr("class", "landmark-river").attr("d", state.path).attr("display", "none");

      state.points = svg.append("g")
        .selectAll("circle")
        .data(currentUniversities, d => d.name)
        .join("circle")
        .attr("class", "uni-point")
        .attr("aria-label", d => `${d.name}, ${d.district}`)
        .attr("cx", d => pointXY(d)[0])
        .attr("cy", d => pointXY(d)[1])
        .attr("r", pointRadius)
        .attr("opacity", dimOpacity)
        .attr("tabindex", 0)
        .on("mouseenter focus", (event, d) => { focusUniversity(d); showTip(event, d); })
        .on("click", (event, d) => {
          event.stopPropagation();
          selectUniversity(d, event);
        })
        .on("mouseleave blur", hideTip);

      state.labelLinks = svg.append("g").attr("aria-label", "대학교 이름 연결선");

      state.labels = svg.append("g")
        .selectAll("text")
        .data(currentUniversities, d => d.name)
        .join("text")
        .attr("class", "label")
        .attr("x", d => pointXY(d)[0] + 7)
        .attr("y", d => pointXY(d)[1] - 7)
        .text(labelText)
        .attr("display", "none");

      state.landmarkPoints = svg.append("g")
        .selectAll("circle")
        .data(seoulLandmarks, d => d.name)
        .join("circle")
        .attr("class", "landmark-point")
        .attr("aria-label", d => `${d.name}, ${d.desc}`)
        .attr("r", 5)
        .attr("tabindex", 0)
        .attr("display", "none")
        .on("mouseenter focus", showLandmarkTip)
        .on("mouseleave blur", () => tooltip.classed("visible", false));

      state.landmarkLinks = svg.append("g").attr("aria-label", "서울에 가면 장소 이름 연결선");

      state.landmarkLabels = svg.append("g")
        .selectAll("text")
        .data(seoulLandmarks, d => d.name)
        .join("text")
        .attr("class", "landmark-label")
        .each(function(d) {
          const text = d3.select(this);
          text.selectAll("tspan")
            .data(landmarkLabelLines(d))
            .join("tspan")
            .text(line => line);
        })
        .attr("display", "none");

      state.districtSign = svg.append("g").attr("class", "district-sign").attr("display", "none");
      state.districtSign.append("line");
      state.districtSign.append("rect").attr("rx", 5).attr("ry", 5);
      state.districtSign.append("text");
      drawSelectedRoute();
      applyFilter();
    }

    Promise.all([
      d3.json(seoulGeoUrl),
      d3.json(gyeonggiGeoUrl),
      d3.json(incheonGeoUrl),
      d3.json(gangwonGeoUrl),
      d3.json(chungcheongGeoUrl),
      d3.json(gyeongsangGeoUrl),
      d3.json(gyeongsangIslandGeoUrl),
      d3.json(jeollaGeoUrl),
      d3.json(nationalGeoUrl),
      d3.json(nationalBoundaryUrl),
      d3.json(nationalJejuGeoUrl),
      d3.csv(stationCsvUrl).catch(() => [])
    ])
      .then(([seoulGeo, gyeonggiGeoRaw, incheonGeoRaw, gangwonGeo, chungcheongGeo, gyeongsangGeo, gyeongsangIslandGeo, jeollaGeo, nationalGeo, nationalBoundary, nationalJejuGeo, stations]) => {
        const gyeonggiGeo = {
          type: "FeatureCollection",
          features: [...gyeonggiGeoRaw.features, ...incheonGeoRaw.features]
        };
        state.geos = { seoul: seoulGeo, gyeonggi: gyeonggiGeo, gangwon: gangwonGeo, chungcheong: chungcheongGeo, gyeongsang: gyeongsangGeo, jeolla: jeollaGeo, national: rewindNationalGeo(nationalGeo) };
        state.nationalBoundary = nationalBoundary;
        state.nationalJejuGeo = rewindNationalGeo(nationalJejuGeo);
        state.gyeongsangIslandGeo = gyeongsangIslandGeo;
        state.cheonanInternalBoundary = null;
        state.chungcheongOuterBoundaries = null;
        state.geo = state.geos[state.currentRegion];
        state.routes = buildRoutes(stations);
        renderLinePicker();
        updateRegionTabs();
        regionTabs.forEach(tab => {
          tab.addEventListener("click", () => selectRegion(tab.dataset.region));
        });
        draw();
        window.addEventListener("resize", () => draw());
        search.addEventListener("input", handleSearchInput);
        departmentSearch.addEventListener("input", handleSearchInput);
        if (landmarkToggle) landmarkToggle.addEventListener("click", toggleLandmarks);
        if (state.districtInsetClose) {
          state.districtInsetClose.addEventListener("click", () => {
            state.activeDistrict = null;
            applyFilter();
          });
        }
      })
      .catch(error => {
        console.error(error);
        errorBox.style.display = "grid";
      });
  </script>
</body>
</html>
