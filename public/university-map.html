<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대학교 모아보기</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="./data/admission-scores.js"></script>
  <script src="./data/admission-offices.js"></script>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66727f;
      --district: #ffffff;
      --map-water: #dfecef;
      --river: #dbeaf2;
      --point: #d64242;
      --panel: rgba(255, 255, 255, 0.92);
      --shadow: 0 16px 45px rgba(31, 48, 65, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(64, 126, 138, 0.13), transparent 28rem),
        linear-gradient(135deg, #eef4f0 0%, #f7f2ea 48%, #edf3f7 100%);
    }

    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    @media (min-width: 941px) {
      .app:has(> main:not(.application-mode)) { height: 100vh; }
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 8px clamp(18px, 4vw, 56px) 8px;
    }

    h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); line-height: 1.12; letter-spacing: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      min-height: 460px;
      padding: 0 clamp(18px, 4vw, 56px) 12px;
    }
    .map-wrap {
      position: relative;
      margin-top: 26px;
      min-height: 420px;
      border: 1px solid rgba(23, 33, 43, 0.1);
      background: rgba(226, 236, 238, 0.82);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: visible;
    }

    .map-reset-bg {
      cursor: pointer;
    }


    .region-tabs {
      position: absolute;
      top: -34px;
      left: 18px;
      right: 18px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      pointer-events: auto;
    }

    .region-tab {
      position: relative;
      min-width: 82px;
      height: 34px;
      margin-left: 0;
      padding: 8px 18px;
      border: 1px solid rgba(40, 93, 91, 0.24);
      border-bottom: 0;
      border-radius: 9px 9px 0 0;
      color: #335a59;
      background: rgba(191, 224, 216, 0.64);
      box-shadow: 0 7px 16px rgba(31, 48, 65, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.52);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }

    .region-tab.active {
      z-index: 2;
      height: 35px;
      transform: translateY(1px);
      color: #173f3e;
      background: rgba(123, 196, 181, 0.92);
      border-color: rgba(34, 101, 96, 0.32);
      box-shadow: 0 9px 18px rgba(31, 48, 65, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.62);
    }

    .region-tab.pending {
      color: rgba(54, 82, 82, 0.7);
      background: rgba(216, 231, 225, 0.78);
    }

    .region-tab.application-tab {
      min-width: 104px;
      margin-left: auto;
      color: #fff;
      background: #245b57;
      border-color: #1d4b48;
    }

    .region-tab.application-tab.active {
      color: #fff;
      background: #173f3e;
    }

    .application-status-view {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: start stretch;
      padding: 32px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      border-radius: inherit;
      background: linear-gradient(145deg, rgba(242, 248, 246, 0.98), rgba(222, 237, 233, 0.98));
    }

    .application-status-view[hidden] { display: none; }
    .application-status-card {
      width: 100%;
      min-width: 0;
      max-width: none;
      margin-bottom: 32px;
      padding: 34px;
      border: 1px solid rgba(36, 91, 87, 0.18);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 44px rgba(31, 48, 65, 0.12);
      text-align: left;
    }
    .application-status-heading { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 16px; }
    .application-title-group { display: flex; align-items: center; gap: 12px; }
    .application-status-card h2 { margin: 0; color: #173f3e; font-size: 28px; }
    .application-status-card p { margin: 0; color: var(--muted); line-height: 1.7; }
    .application-count {
      min-width: 78px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #173f3e;
      background: #d9ebe6;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
    }
    .student-export-controls { display: flex; align-items: end; justify-content: flex-start; gap: 7px; flex-wrap: wrap; }
    .student-export-controls label { margin: 0; color: #52636d; font-size: 10px; }
    .student-export-controls input {
      display: block;
      width: 58px;
      min-height: 34px;
      margin-top: 3px;
      padding: 5px 7px;
      font-size: 12px;
    }
    .student-export-controls .student-name-input { width: 104px; }
    .excel-export-button {
      min-height: 34px;
      padding: 7px 14px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: #18723b;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }
    .excel-export-button:hover, .excel-export-button:focus { background: #10552b; outline: none; }
    .pdf-export-button {
      min-height: 34px;
      padding: 7px 14px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: #a43a32;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }
    .pdf-export-button:hover, .pdf-export-button:focus { background: #7d2823; outline: none; }
    .application-mode-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid rgba(36, 91, 87, 0.22);
      border-radius: 9px;
      background: #f2f6f5;
    }
    .application-mode-option {
      min-width: 58px;
      padding: 6px 14px;
      border: 0;
      border-radius: 6px;
      color: #52636d;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      transition: background 120ms ease, color 120ms ease;
    }
    .application-mode-option:hover, .application-mode-option:focus-visible { color: #173f3e; background: rgba(36, 91, 87, 0.1); outline: none; }
    .application-mode-option.susi.active { color: #fff; background: #245b57; }
    .application-mode-option.jeongsi.active { color: #fff; background: #2f5f9e; }
    .jeongsi-layout { max-width: 720px; margin-left: 54px; }
    .jeongsi-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .jeongsi-slot {
      position: relative;
      display: grid;
      align-content: start;
      gap: 4px;
      min-height: 96px;
      padding: 14px 16px;
      border: 1px dashed rgba(47, 95, 158, 0.38);
      border-radius: 12px;
      background: rgba(240, 246, 253, 0.7);
    }
    .jeongsi-slot.filled { border-style: solid; background: #fff; box-shadow: 0 6px 16px rgba(31, 48, 65, 0.08); }
    .jeongsi-slot h3 { margin: 0 0 6px; color: #2f5f9e; font-size: 15px; }
    .jeongsi-slot strong { color: #173f3e; font-size: 15px; }
    .jeongsi-slot-department { color: #263843; font-size: 13px; }
    .jeongsi-slot-empty { color: var(--muted); font-size: 12px; }
    .jeongsi-slot-clear, .jeongsi-candidate-remove {
      width: 26px;
      height: 26px;
      border: 1px solid rgba(164, 58, 50, 0.3);
      border-radius: 50%;
      color: #a43a32;
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      line-height: 1;
    }
    .jeongsi-slot-clear { position: absolute; top: 10px; right: 10px; }
    .jeongsi-slot-clear:hover, .jeongsi-slot-clear:focus,
    .jeongsi-candidate-remove:hover, .jeongsi-candidate-remove:focus { background: #fff1f1; outline: none; }
    .jeongsi-candidates-section { margin-top: 22px; padding-top: 20px; border-top: 2px solid rgba(36, 91, 87, 0.14); }
    .jeongsi-candidates-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .jeongsi-candidates-heading h3 { margin: 0; color: #243944; font-size: 16px; }
    .jeongsi-candidates-help { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .jeongsi-sort { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: #eef3f2; }
    .jeongsi-sort-button {
      padding: 4px 10px;
      border: 0;
      border-radius: 5px;
      color: #52636d;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
    }
    .jeongsi-sort-button:hover, .jeongsi-sort-button:focus-visible { color: #173f3e; outline: none; }
    .jeongsi-sort-button.active { color: #fff; background: #2f5f9e; }
    .jeongsi-candidates {
      position: relative;
      display: grid;
      align-content: start;
      gap: 8px;
      max-height: min(420px, calc(100vh - 360px));
      min-height: 160px;
      padding: 2px 6px 2px 2px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .susi-guide-link.jeongsi-guide-link { min-width: 64px; padding: 6px 10px; font-size: 12.5px; text-align: center; }
    .jeongsi-candidate {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 6px;
      border: 1px solid rgba(36, 91, 87, 0.16);
      border-radius: 10px;
      background: #fff;
    }
    .jeongsi-candidate.expanded { border-color: #2f5f9e; box-shadow: 0 0 0 2px rgba(47, 95, 158, 0.14); }
    .jeongsi-candidate.placed { background: rgba(240, 246, 253, 0.7); }
    .jeongsi-candidate-main {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 12px;
      min-height: 36px;
      padding: 6px 8px;
      border: 0;
      border-radius: 7px;
      color: #263843;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      text-align: left;
    }
    .jeongsi-candidate-main:hover, .jeongsi-candidate-main:focus { background: rgba(36, 91, 87, 0.08); outline: none; }
    .jeongsi-candidate-main strong { color: #173f3e; }
    .jeongsi-candidate-badge {
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
      background: #2f5f9e;
      font-size: 11px;
      font-style: normal;
      font-weight: 800;
    }
    .jeongsi-group-picker { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 8px 6px; }
    .jeongsi-group-button {
      min-width: 72px;
      padding: 7px 14px;
      border: 1px solid #2f5f9e;
      border-radius: 7px;
      color: #2f5f9e;
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }
    .jeongsi-group-button:hover, .jeongsi-group-button:focus, .jeongsi-group-button.active { color: #fff; background: #2f5f9e; outline: none; }
    .application-print-report { display: none; }
    .application-selection-list { display: grid; gap: 10px; margin-top: 22px; }
    .application-selection-section { min-width: 0; }
    .application-selection-section + .application-selection-section {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 2px solid rgba(36, 91, 87, 0.14);
    }
    .application-selection-section-heading {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      width: calc(100% - 54px);
      margin-left: 54px;
      margin-bottom: 10px;
    }
    .application-selection-section-heading h3 { margin: 0; color: #243944; font-size: 16px; }
    .application-selection-section-heading span { color: var(--muted); font-size: 11px; }
    .application-selection-section-actions { display: flex; align-items: center; gap: 8px; }
    .application-direct-add-toggle {
      padding: 6px 10px;
      border: 1px solid #245b57;
      border-radius: 7px;
      color: #245b57;
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
    }
    .application-direct-add-toggle:hover, .application-direct-add-toggle:focus { color: #fff; background: #245b57; outline: none; }
    .application-selection-reset-button {
      padding: 6px 10px;
      border: 1px solid rgba(143, 43, 43, 0.34);
      border-radius: 7px;
      color: #8f2b2b;
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
    }
    .application-selection-reset-button:hover, .application-selection-reset-button:focus { background: #fff1f1; outline: none; }
    .application-selection-reset-button:disabled { opacity: 0.42; cursor: default; }
    .application-direct-add-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 8px;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(36, 91, 87, 0.18);
      border-radius: 10px;
      background: rgba(242, 248, 246, 0.8);
    }
    .application-direct-add-form[hidden] { display: none !important; }
    .application-direct-add-form input { min-height: 36px; font-size: 12px; }
    .application-direct-add-submit {
      padding: 7px 13px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: #245b57;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }
    .application-direct-add-close {
      width: 36px;
      min-height: 36px;
      padding: 0;
      border: 1px solid rgba(36, 91, 87, 0.25);
      border-radius: 7px;
      color: #52636d;
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 21px;
      line-height: 1;
    }
    .application-direct-add-close:hover, .application-direct-add-close:focus { color: #173f3e; background: #e7f1ee; outline: none; }
    .application-direct-add-form.application-table-row {
      margin: 4px 0 0;
      padding: 6px 8px;
      border-style: dashed;
      background: #eef7f4;
    }
    .application-direct-add-form.application-table-row .application-detail-input { min-height: 32px; padding: 4px 6px; }
    .application-direct-add-form.application-table-row .application-direct-add-close,
    .application-direct-add-form.application-table-row .application-direct-add-submit {
      width: 100%;
      min-height: 32px;
      padding: 0;
    }
    .application-direct-add-form.application-table-row .application-direct-add-submit { font-size: 18px; }
    .application-selection-items { display: grid; gap: 10px; }
    .application-selection-empty {
      padding: 42px 20px;
      border: 1px dashed rgba(36, 91, 87, 0.28);
      border-radius: 12px;
      background: rgba(242, 248, 246, 0.74);
      text-align: center;
    }
    .application-selection-item {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(130px, 0.8fr) minmax(180px, 1.2fr) auto;
      align-items: center;
      gap: 14px;
      padding: 13px 14px;
      border: 1px solid rgba(36, 91, 87, 0.14);
      border-radius: 10px;
      background: #fff;
    }
    .application-selection-item.general-purpose {
      position: relative;
      width: calc(100% - 54px);
      margin-left: 54px;
      grid-template-columns: 44px minmax(220px, 1fr) minmax(180px, 0.8fr) minmax(240px, 1.2fr) auto;
    }
    .application-order-controls {
      display: flex;
      gap: 2px;
    }
    .application-order-button {
      width: 20px;
      height: 22px;
      padding: 0;
      border: 1px solid rgba(36, 91, 87, 0.25);
      border-radius: 5px;
      color: #245b57;
      background: #f7fbfa;
      cursor: pointer;
      font-size: 8px;
      font-weight: 900;
    }
    .application-order-button:hover, .application-order-button:focus { color: #fff; background: #245b57; outline: none; }
    .application-order-button:disabled { color: #aab6b6; background: #f3f5f5; cursor: default; opacity: 0.55; }
    .application-rank {
      position: absolute;
      top: 50%;
      left: -48px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 30px;
      transform: translateY(-50%);
      color: #245b57 !important;
      background: transparent;
      font-size: 15px !important;
      font-weight: 600;
    }
    .application-rank::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 6px;
      height: 1px;
      background: #8aa9a2;
    }
    .application-rank.over-limit {
      left: -52px;
      width: 40px;
      color: #8f2b2b !important;
      font-size: 12px !important;
    }
    .application-rank.over-limit::before { background: #d39995; }
    .application-table-scroll {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
      padding: 2px 2px 12px 54px;
      scrollbar-color: #7fa7a0 #e8f0ee;
    }
    .application-table-content { min-width: 480px; }
    .application-table-content .application-selection-items { gap: 4px; }
    .application-table-header,
    .application-selection-item.application-table-row,
    .application-direct-add-form.application-table-row {
      display: grid;
      grid-template-columns: 32px minmax(160px, 1.45fr) minmax(100px, 1fr) minmax(76px, 1.05fr) minmax(86px, 1.2fr);
      gap: 6px;
      align-items: stretch;
    }
    .susi-layout {
      display: grid;
      grid-template-columns: minmax(0, 820px) minmax(340px, 1fr);
      align-items: start;
      gap: 20px;
    }
    .susi-tables { min-width: 0; }
    .susi-detail {
      position: sticky;
      top: 12px;
      margin-top: 42px;
      padding: 16px;
      border: 1px solid rgba(36, 91, 87, 0.2);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(31, 48, 65, 0.08);
    }
    .susi-detail-empty { color: var(--muted); font-size: 12px; }
    .susi-detail-heading { display: grid; gap: 2px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(36, 91, 87, 0.14); }
    .susi-detail-heading small { color: #2e6759; font-size: 11px; font-weight: 900; }
    .susi-detail-heading strong { color: #173f3e; font-size: 16px; }
    .susi-detail-heading span { color: #52636d; font-size: 12px; }
    .susi-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
    @media (min-width: 1500px) {
      .susi-detail-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .susi-detail-field { display: grid; gap: 5px; margin: 0; }
    .susi-detail-field.wide { grid-column: 1 / -1; }
    .susi-detail-field > span { color: #52636d; font-size: 12px; font-weight: 800; }
    .susi-detail-field .application-detail-input { min-height: 36px; padding: 6px 9px; font-size: 13px; }
    .susi-detail-field textarea.application-detail-input { min-height: 72px; }
    .susi-detail { padding: 18px 20px; }
    .susi-detail-heading strong { font-size: 18px; }
    .susi-detail-heading span { font-size: 13px; }
    .susi-tables .application-selection-empty { padding: 20px; }
    .application-table-header span:nth-child(n+3),
    .application-table-row .application-detail-input[data-field] { position: static; box-shadow: none; }
    .application-selection-item.application-table-row { cursor: pointer; }
    .application-table-row .application-university-cell { flex-direction: row; align-items: center; gap: 8px; padding-right: 4px; }
    .application-university-name { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
    .application-table-row .application-university-remove-button { top: -7px; right: -7px; z-index: 4; }
    .susi-guide-link {
      flex: none;
      padding: 5px 8px;
      border-radius: 6px;
      color: #fff;
      background: #4a78b8;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
    }
    .susi-guide-link:hover, .susi-guide-link:focus { background: #395f94; outline: none; }
    .susi-guide-link.missing { color: #8a999d; background: #eef2f2; }
    .application-direct-add-actions { display: grid; gap: 3px; }
    .application-direct-add-form.application-table-row .application-direct-add-actions .application-direct-add-close,
    .application-direct-add-form.application-table-row .application-direct-add-actions .application-direct-add-submit {
      width: 100%;
      min-height: 18px;
      font-size: 14px;
      line-height: 1;
    }
    .application-selection-item.application-table-row.selected { border-color: #2e6759; box-shadow: 0 0 0 2px rgba(46, 103, 89, 0.22); }
    @media (max-width: 1100px) {
      .susi-layout { grid-template-columns: minmax(0, 1fr); }
      .susi-detail { position: static; margin: 0 0 0 54px; }
    }
    .application-table-header {
      margin-bottom: 4px;
      padding: 0 8px;
      color: #fff;

    .inset-point {

      pointer-events: none;

    .inset-label {

      font-weight: 900;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 3px;
      cursor: pointer;
      pointer-events: auto;
    }

    .inset-empty {
      fill: rgba(70, 85, 95, 0.62);
      font-size: 13px;
      font-weight: 800;
      text-anchor: middle;

    }
    .tooltip strong { display: block; font-size: 15px; line-height: 1.3; }

    aside { display: flex; flex-direction: column; min-height: 0; gap: 12px; }

    .map-search {

    aside > .map-search { position: static; flex: none; width: auto; }

    label { display: block; margin-bottom: 7px; color: #344552; font-size: 13px; font-weight: 700; }

    .department-result-button {

    .department-result-button:hover, .department-result-button:focus { background: #eef6f4; outline: none; }
    .department-results-empty { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .department-results-toggle {
      display: flex;

      width: 100%;

      border: 0;

    }
    .department-results-toggle-label { display: none; color: #2e6759; font-size: 11px; font-weight: 800; }
    .map-search.in-aside .department-results-toggle { cursor: pointer; }
    .map-search.in-aside .department-results-toggle-label { display: inline; }
    .map-search.in-aside .department-results-list { max-height: 150px; }
    .map-search.in-aside .department-results.collapsed .department-results-list { display: none; }
    .map-search.in-aside .department-results.collapsed .department-results-title { margin-bottom: 0; }

    .department-panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background: var(--panel);
      border: 1px solid rgba(23, 33, 43, 0.1);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(31, 48, 65, 0.1);
    }
    .department-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .department-panel h2 { margin: 0; color: #172636; font-size: 16px; line-height: 1.35; }
    .admission-link {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 6px;
      color: #fff;
      background: #4a78b8;

    }
    .admission-link:hover, .admission-link:focus { background: #395f94; outline: none; }
    .department-title-row { margin-bottom: 12px; }
    .department-title-text { min-width: 0; }
    .department-title-text .meta { margin-bottom: 0; }
    .admission-score-missing { margin: 3px 0 0; color: #8a999d; font-size: 11px; }
    .admission-actions { display: flex; flex: 0 0 auto; flex-direction: column; gap: 5px; min-width: 64px; }
    .admission-link.office-link,
    .susi-guide-link.office-link { background: #5b4e8c; }
    .admission-link.office-link:hover, .admission-link.office-link:focus,
    .susi-guide-link.office-link:hover, .susi-guide-link.office-link:focus { background: #463b6e; }
    .department-panel .meta { margin: 6px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .department-panel h3 { margin: 14px 0 8px; color: #2d3e4b; font-size: 13px; }
    .department-panel ul { margin: 0; padding-left: 18px; color: #263843; font-size: 12px; line-height: 1.55; }
    .department-panel li {
      position: relative;
      min-height: 28px;
      padding: 5px 2px;
      border-radius: 6px;
    }
    .department-line { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .department-panel li + li { margin-top: 1px; }
    .department-panel li:hover, .department-panel li.actions-open { background: rgba(36, 91, 87, 0.08); }
    .department-select-actions {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 2px 0 18px;
      background: linear-gradient(to right, rgba(238, 243, 242, 0), #eef3f2 16px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .department-panel li.highlighted-department .department-select-actions {
      background: linear-gradient(to right, rgba(255, 247, 216, 0), #fff7d8 16px);
    }
    .department-panel li:hover .department-select-actions,
    .department-panel li.actions-open .department-select-actions,
    .department-panel li:has(.department-select-button:focus-visible) .department-select-actions,
    .department-panel li.actions-confirming .department-select-actions { opacity: 1; visibility: visible; pointer-events: auto; }
    .department-panel li.actions-dismissed .department-select-actions {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 350ms ease, visibility 0s linear 350ms;
    }
    .department-select-button {
      min-width: 46px;
      padding: 4px 6px;
      border: 1px solid #245b57;
      border-radius: 6px;
      color: #fff;
      background: #245b57;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
      transition: background 120ms ease;
    }
    .department-select-button:hover, .department-select-button:focus { background: #173f3e; outline: none; }
    .department-select-button.jeongsi { border-color: #2f5f9e; background: #2f5f9e; }
    .department-select-button.jeongsi:hover, .department-select-button.jeongsi:focus { background: #224a7d; }
    .department-select-button.selected,
    .department-select-button.jeongsi.selected { border-color: #74867f; background: #74867f; }
    .admission-score {
      margin-left: 6px;
      color: #1f56b8;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .department-panel li.highlighted-department {
      margin-left: -4px;
      padding-left: 6px;
      border-radius: 5px;
      background: rgba(255, 225, 103, 0.26);

    }
    .department-panel mark {
      padding: 0 2px;
      border-radius: 3px;
      color: #102331;
      background: #ffe167;
      box-shadow: 0 0 0 1px rgba(150, 114, 0, 0.16);
    }
    .department-empty { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .error { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; color: #8f2b2b; background: rgba(255, 255, 255, 0.82); text-align: center; font-weight: 700; }


    @media (max-width: 940px) {
      header { align-items: stretch; flex-direction: column; }
      main { grid-template-columns: 1fr; height: auto; min-height: 0; }
      .map-wrap, svg { min-height: 520px; }
      aside { max-height: 380px; }

      .favorite-button { min-height: 31px; font-size: 12px; gap: 7px; }

      .district-inset.incheon-inset { width: min(430px, calc(100% - 24px)); min-width: 0; }

      .district-inset.incheon-inset svg { height: 340px; }

    @media print {

<body>
  <div class="app">
    <header>
      <div>
        <h1>대학교 모아보기</h1>
        <p class="subtitle">본 자료는 풍산고등학교 학생의 진로·진학 지도 참고용으로 제작되었으며, 경기도교육청 제공 자료(모집요강 링크)와 대학 공개 자료(최근 정시 최종등록자 70% 컷의 국어·수학·탐구 백분위 평균, 학과명 옆 파란 숫자)를 참고하였습니다.</p>
      </div>
    </header>

    <main>
      <section class="map-wrap" aria-label="서울 대학교 인터랙티브 지도">
        <div class="region-tabs" aria-label="지역 지도 선택">
          <button class="region-tab active" type="button" data-region="seoul" aria-current="page">서울</button>
          <button class="region-tab pending" type="button" data-region="gyeonggi">경기권</button>
          <button class="region-tab pending" type="button" data-region="gangwon">강원권</button>
          <button class="region-tab pending" type="button" data-region="chungcheong">충청권</button>
          <button class="region-tab pending" type="button" data-region="gyeongsang">영남권</button>
          <button class="region-tab pending" type="button" data-region="jeolla">호남권</button>
          <button class="region-tab pending" type="button" data-region="national">전국</button>
          <button class="region-tab pending" type="button" data-region="capital">수도권</button>
          <button id="applicationStatusTab" class="region-tab application-tab" type="button">원서현황</button>
        </div>
        <section id="applicationStatusView" class="application-status-view" aria-labelledby="applicationStatusTitle" hidden>
          <div class="application-status-card">
            <div class="application-status-heading">
              <div class="application-title-group">
                <h2 id="applicationStatusTitle">수시 원서현황</h2>
                <div id="applicationModeSwitch" class="application-mode-switch" role="group" aria-label="수시·정시 원서현황 전환">
                  <button class="application-mode-option susi active" type="button" data-mode="susi" aria-pressed="true">수시</button>
                  <button class="application-mode-option jeongsi" type="button" data-mode="jeongsi" aria-pressed="false">정시</button>
                </div>
                <span id="applicationCount" class="application-count">선택 0개</span>
              </div>
              <div class="student-export-controls" aria-label="학생 정보 및 파일 저장">
                <label>학년<input id="studentGrade" type="text" inputmode="numeric" maxlength="1" required></label>
                <label>반<input id="studentClass" type="text" inputmode="numeric" maxlength="2" required></label>
                <label>번호<input id="studentNumber" type="text" inputmode="numeric" maxlength="2" required></label>
                <label>이름<input id="studentName" class="student-name-input" type="text" maxlength="20" required></label>
                <button id="excelExportButton" class="excel-export-button" type="button">Excel 저장</button>
                <button id="pdfExportButton" class="pdf-export-button" type="button">PDF 저장</button>
              </div>
            </div>
            <div id="applicationSelectionList" class="application-selection-list" aria-live="polite"></div>
          </div>
        </section>
        <div id="linePicker" class="line-picker" aria-label="지하철 노선 선택"></div>
        <div id="favoritePicker" class="favorite-picker" aria-label="전국 즐겨찾기 선택"></div>
        <div id="landmarkPanel" class="landmark-panel">
          <button id="landmarkToggle" class="landmark-toggle" type="button" aria-pressed="false" title="서울에 가면"><span class="landmark-star">★</span><span>서울에 가면</span></button>
        </div>
        <div id="districtNameBadge" class="district-name-badge" aria-live="polite" hidden></div>
        <div class="map-search">
          <label for="search">대학교 검색</label>
          <input id="search" type="search" placeholder="예: 연세대, 카이스트, POSTECH" autocomplete="off" />
          <label for="departmentSearch">학과 검색</label>
          <input id="departmentSearch" type="search" placeholder="예: 컴퓨터공학과, 경영학과" autocomplete="off" />
          <div id="departmentResults" class="department-results" aria-live="polite"></div>
        </div>
        <div id="districtInset" class="district-inset" hidden>
          <button id="districtInsetClose" class="district-inset-close" type="button" aria-label="확대 지도 닫기">×</button>
          <h3 id="districtInsetTitle"></h3>
          <svg id="districtInsetMap" role="img" aria-label="선택 지역 확대 지도"></svg>
        </div>
        <svg id="map" role="img" aria-labelledby="mapTitle mapDesc" tabindex="0">
          <title id="mapTitle">서울 주요 대학교와 지하철 노선 지도</title>
          <desc id="mapDesc">서울시 자치구 경계와 대학교 위치, 선택한 지하철 노선이 표시되는 지도입니다.</desc>

    function preparePointOffsets(items) {
      const shouldSpread = ["gyeonggi", "chungcheong", "gyeongsang", "jeolla"].includes(state.currentRegion);
      items.forEach(d => {
        d._displayOffsetX = shouldSpread ? 0 : (d.offsetX || 0);
        d._displayOffsetY = shouldSpread ? 0 : (d.offsetY || 0);
      });
      if (!shouldSpread) return;
      const regionalDense = ["gyeongsang", "jeolla"].includes(state.currentRegion);
      const minDistance = state.currentRegion === "chungcheong" ? 9 : regionalDense ? 12 : 12;
      const maxOffset = state.currentRegion === "chungcheong" ? 4 : regionalDense ? 7 : 7;
      for (let iteration = 0; iteration < 70; iteration++) {
        let adjusted = false;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const a = items[i];
            const b = items[j];
            const [ax, ay] = pointXY(a);
            const [bx, by] = pointXY(b);
            let dx = ax - bx;
            let dy = ay - by;
            let distance = Math.hypot(dx, dy);
            if (distance >= minDistance) continue;
            if (distance < 0.01) {

            }
            const push = (minDistance - distance) / 2 + 0.18;
            const ux = dx / distance;
            const uy = dy / distance;
            a._displayOffsetX = clamp(a._displayOffsetX + ux * push, -maxOffset, maxOffset);
            a._displayOffsetY = clamp(a._displayOffsetY + uy * push, -maxOffset, maxOffset);
            b._displayOffsetX = clamp(b._displayOffsetX - ux * push, -maxOffset, maxOffset);

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")

        .replace(/"/g, "&quot;")

    function normalizedUniversityName(name) {
      return String(name || "").replace(/\s+/g, "").replace(/대학교$/, "대학교");
    }

    function universityOwnership(d) {
      const name = d?.name || "";
      if (name.includes("국립") || publicUniversityNames.has(name) || publicUniversityNames.has(normalizedUniversityName(name))) {
        return "국공립";
      }
      return "사립";
    }

    function universityMeta(d) {
      return `${d.district} · ${universityOwnership(d)}`;
    }

    function highlightMatch(value, query) {
      const text = String(value);
      if (!query) return escapeHtml(text);
      const lower = text.toLowerCase();
      const index = lower.indexOf(query);
      if (index < 0) return escapeHtml(text);
      const end = index + query.length;
      return `${escapeHtml(text.slice(0, index))}<mark>${escapeHtml(text.slice(index, end))}</mark>${escapeHtml(text.slice(end))}`;
    }

    function startsWithDepartment(name, terms) {
      return terms.some(term =>
        name === term ||
        name.startsWith(`${term}(`) ||
        name.startsWith(`${term} `) ||
        name.startsWith(`${term}·`) ||
        name.startsWith(`${term}전공`)
      );
    }

    function favoriteDepartmentMatched(name) {
      if (state.currentRegion !== "national" || !state.activeFavorite || state.activeFavorite === "science") return false;
      const matchers = {
        medical: dept => startsWithDepartment(dept, ["의예과", "의학과"]) || dept === "의학과(의예과)",
        dental: dept => startsWithDepartment(dept, ["치의예과", "치의학과"]),
        pharmacy: dept => startsWithDepartment(dept, ["약학과", "약학부", "약학전공", "제약학과", "제약학전공", "산업제약학과", "한약학과", "미래산업약학전공"]),
        "korean-medicine": dept => startsWithDepartment(dept, ["한의예과", "한의학과"]),
        veterinary: dept => startsWithDepartment(dept, ["수의예과", "수의학과"])
      };
      return Boolean(matchers[state.activeFavorite]?.(String(name || "")));
    }

    function departmentNameMarkup(name, query, favoriteMatched) {
      if (query) return highlightMatch(name, query);
      return favoriteMatched ? `<mark>${escapeHtml(name)}</mark>` : escapeHtml(name);
    }

    function applicationSelectionKey(university, college, department) {
      return [university, college, department].map(value => encodeURIComponent(value)).join("|");
    }

    function isApplicationSelected(university, college, department, target = "susi") {
      const key = applicationSelectionKey(university, college, department);
      const selections = target === "jeongsi" ? jeongsiCandidates : applicationSelections;
      return selections.some(item => item.key === key);
    }

    function isSpecialPurposeSelection(item) {
      return item.category === "special" || (item.category !== "general" && specialPurposeUniversities.has(item.university));
    }

    function saveApplicationSelections() {
      try {
        localStorage.setItem(applicationStorageKey, JSON.stringify(applicationSelections));
      } catch (error) {
        console.warn("원서현황을 브라우저에 저장하지 못했습니다.", error);
      }
    }

    function loadApplicationSelections() {
      try {
        const saved = JSON.parse(localStorage.getItem(applicationStorageKey) || "[]");
        if (!Array.isArray(saved)) return;
        const uniqueSelections = new Map();
        saved.forEach(item => {
          if (!item || typeof item.university !== "string" || typeof item.college !== "string" || typeof item.department !== "string") return;
          const key = applicationSelectionKey(item.university, item.college, item.department);
          const category = item.category === "special" || item.category === "general" ? item.category : undefined;
          const restored = { key, university: item.university, college: item.college, department: item.department, category };
          applicationDetailFields.forEach(field => {
            restored[field] = typeof item[field] === "string" ? item[field] : "";
          });
          uniqueSelections.set(key, restored);
        });
        applicationSelections.splice(0, applicationSelections.length, ...uniqueSelections.values());
      } catch (error) {
        console.warn("저장된 원서현황을 불러오지 못했습니다.", error);
      }
    }

    function saveJeongsiSelections() {
      try {
        localStorage.setItem(jeongsiStorageKey, JSON.stringify({ candidates: jeongsiCandidates, slots: jeongsiSlots }));
      } catch (error) {
        console.warn("정시 원서현황을 브라우저에 저장하지 못했습니다.", error);
      }
    }

    function loadJeongsiSelections() {
      try {
        const saved = JSON.parse(localStorage.getItem(jeongsiStorageKey) || "{}");
        const uniqueCandidates = new Map();
        (Array.isArray(saved.candidates) ? saved.candidates : []).forEach(item => {
          if (!item || typeof item.university !== "string" || typeof item.college !== "string" || typeof item.department !== "string") return;
          const key = applicationSelectionKey(item.university, item.college, item.department);
          uniqueCandidates.set(key, { key, university: item.university, college: item.college, department: item.department });
        });
        jeongsiCandidates.splice(0, jeongsiCandidates.length, ...uniqueCandidates.values());
        jeongsiGroups.forEach(([group]) => {
          const key = saved.slots?.[group];
          jeongsiSlots[group] = uniqueCandidates.has(key) ? key : null;
        });
      } catch (error) {
        console.warn("저장된 정시 원서현황을 불러오지 못했습니다.", error);
      }
    }

    function setApplicationMode(mode) {
      applicationMode = mode === "jeongsi" ? "jeongsi" : "susi";
      expandedJeongsiKey = null;
      renderApplicationSelections();
    }

    function updateApplicationModeControls() {
      const jeongsi = applicationMode === "jeongsi";
      applicationModeSwitch.querySelectorAll(".application-mode-option").forEach(option => {
        const active = option.dataset.mode === applicationMode;
        option.classList.toggle("active", active);
        option.setAttribute("aria-pressed", String(active));
      });
      document.querySelector("#applicationStatusTitle").textContent = jeongsi ? "정시 원서현황" : "수시 원서현황";
      excelExportButton.hidden = jeongsi;
      pdfExportButton.hidden = jeongsi;
    }

    function jeongsiGroupOf(key) {
      return jeongsiGroups.find(([group]) => jeongsiSlots[group] === key) || null;
    }

    function assignJeongsiGroup(key, group) {
      if (!jeongsiCandidates.some(item => item.key === key) || !(group in jeongsiSlots)) return;
      jeongsiGroups.forEach(([other]) => {
        if (jeongsiSlots[other] === key) jeongsiSlots[other] = null;
      });
      jeongsiSlots[group] = key;
      expandedJeongsiKey = null;
      saveJeongsiSelections();
      renderApplicationSelections();
    }

    function clearJeongsiGroup(group) {
      if (!(group in jeongsiSlots)) return;
      jeongsiSlots[group] = null;
      saveJeongsiSelections();
      renderApplicationSelections();
    }

    function removeJeongsiCandidate(key) {
      const index = jeongsiCandidates.findIndex(item => item.key === key);
      if (index < 0) return;
      jeongsiCandidates.splice(index, 1);
      jeongsiGroups.forEach(([group]) => {
        if (jeongsiSlots[group] === key) jeongsiSlots[group] = null;
      });
      if (expandedJeongsiKey === key) expandedJeongsiKey = null;
      saveJeongsiSelections();
      renderApplicationSelections();
      if (state.selectedUniversity) renderDepartmentPanel(state.selectedUniversity);
    }

    function resetJeongsiSelections() {
      if (!jeongsiCandidates.length) return;
      if (!window.confirm(`정시 원서현황 ${jeongsiCandidates.length}개를 모두 초기화할까요?`)) return;
      jeongsiCandidates.splice(0, jeongsiCandidates.length);
      jeongsiGroups.forEach(([group]) => { jeongsiSlots[group] = null; });
      expandedJeongsiKey = null;
      saveJeongsiSelections();
      renderApplicationSelections();
      if (state.selectedUniversity) renderDepartmentPanel(state.selectedUniversity);
    }

    function admissionOfficeUrl(universityName) {
      const offices = window.ADMISSION_OFFICES || {};
      return offices[universityName] || offices[baseUniversityName(universityName)] || "";
    }

    function jeongsiGuideLink(item) {
      const officeUrl = admissionOfficeUrl(item.university);
      return officeUrl
        ? `<a class="susi-guide-link office-link jeongsi-guide-link" href="${escapeHtml(officeUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(`${item.university} 입학처 열기`)}">입학처</a>`
        : `<span class="susi-guide-link missing jeongsi-guide-link" aria-label="입학처 링크 없음">링크 없음</span>`;
    }

    function renderJeongsiSelections() {
      const placedCount = jeongsiGroups.filter(([group]) => jeongsiSlots[group]).length;
      applicationCount.textContent = `후보 ${jeongsiCandidates.length}개 · 배치 ${placedCount}/3`;
      const percentileMarkup = item => {
        const score = admissionScoreFor(item.university, item.department);
        return score?.percentile != null ? `<span class="admission-score">${escapeHtml(score.percentile)}</span>` : "";
      };

      const slots = jeongsiGroups.map(([group, label]) => {
        const item = jeongsiCandidates.find(candidate => candidate.key === jeongsiSlots[group]);
        const body = item
          ? `<strong>${escapeHtml(item.university)}</strong>
             <span class="jeongsi-slot-department">${escapeHtml(item.department)}${percentileMarkup(item)}</span>
             <button class="jeongsi-slot-clear" type="button" data-group="${group}" aria-label="${escapeHtml(`${label} 배치 해제`)}">×</button>`
          : `<span class="jeongsi-slot-empty">아래 목록에서 대학을 눌러 배치하세요</span>`;
        return `<div class="jeongsi-slot${item ? " filled" : ""}"><h3>${label}</h3>${body}</div>`;
      }).join("");

      const percentileOf = item => admissionScoreFor(item.university, item.department)?.percentile ?? -Infinity;
      const orderedCandidates = jeongsiSort === "percentile"
        ? [...jeongsiCandidates].sort((a, b) => percentileOf(b) - percentileOf(a))
        : jeongsiCandidates;
      const sortButton = (value, label) =>
        `<button class="jeongsi-sort-button${jeongsiSort === value ? " active" : ""}" type="button" data-sort="${value}" aria-pressed="${jeongsiSort === value}">${label}</button>`;

      const candidates = jeongsiCandidates.length
        ? orderedCandidates.map(item => {
          const placed = jeongsiGroupOf(item.key);
          const expanded = expandedJeongsiKey === item.key;
          const groupButtons = expanded
            ? `<div class="jeongsi-group-picker" role="group" aria-label="${escapeHtml(`${item.university} ${item.department} 군 선택`)}">${jeongsiGroups.map(([group, label]) => {
              const occupied = jeongsiSlots[group] && jeongsiSlots[group] !== item.key;
              return `<button class="jeongsi-group-button${placed?.[0] === group ? " active" : ""}" type="button" data-selection-key="${escapeHtml(item.key)}" data-group="${group}" title="${occupied ? "배치된 대학을 이 대학으로 바꿉니다" : ""}">${label}${occupied ? " (교체)" : ""}</button>`;
            }).join("")}</div>`
            : "";
          return `
            <div class="jeongsi-candidate${expanded ? " expanded" : ""}${placed ? " placed" : ""}">
              <button class="jeongsi-candidate-main" type="button" data-selection-key="${escapeHtml(item.key)}" aria-expanded="${expanded}">
                <strong>${escapeHtml(item.university)}</strong>
                <span>${escapeHtml(item.department)}${percentileMarkup(item)}</span>
                ${placed ? `<em class="jeongsi-candidate-badge">${placed[1]}</em>` : ""}
              </button>
              ${jeongsiGuideLink(item)}
              <button class="jeongsi-candidate-remove" type="button" data-selection-key="${escapeHtml(item.key)}" aria-label="${escapeHtml(`${item.university} ${item.department} 삭제`)}">×</button>
              ${groupButtons}
            </div>`;
        }).join("")
        : `<div class="application-selection-empty"><p>정시 후보로 고른 대학이 없습니다. 지도에서 학과의 "정시" 버튼을 누르면 이곳에 담깁니다.</p></div>`;

      const previousScrollTop = applicationSelectionList.querySelector(".jeongsi-candidates")?.scrollTop || 0;
      applicationSelectionList.innerHTML = `
        <div class="jeongsi-layout">
          <section class="jeongsi-board" aria-label="정시 가·나·다군 배치">
            <div class="jeongsi-slots">${slots}</div>
          </section>
          <section class="jeongsi-candidates-section" aria-labelledby="jeongsiCandidatesTitle">
            <div class="jeongsi-candidates-heading">
              <h3 id="jeongsiCandidatesTitle">정시 후보 목록</h3>
              <div class="jeongsi-sort" role="group" aria-label="후보 정렬">${sortButton("added", "담은 순")}${sortButton("percentile", "백분위순")}</div>
              <button class="application-selection-reset-button jeongsi-reset-button" type="button" ${jeongsiCandidates.length ? "" : "disabled"}>초기화</button>
              <p class="jeongsi-candidates-help">대학을 누르면 가·나·다군을 고를 수 있습니다. 이미 배치된 군을 고르면 새 대학으로 바뀝니다.</p>
            </div>
            <div class="jeongsi-candidates">${candidates}</div>
          </section>
        </div>
      `;
      const candidateList = applicationSelectionList.querySelector(".jeongsi-candidates");
      candidateList.scrollTop = previousScrollTop;
      const expanded = candidateList.querySelector(".jeongsi-candidate.expanded");
      if (expanded) {
        const overflow = expanded.offsetTop + expanded.offsetHeight - (candidateList.scrollTop + candidateList.clientHeight);
        if (overflow > 0) candidateList.scrollTop += overflow + 4;
      }
    }

    function handleJeongsiClick(event) {
      const groupButton = event.target.closest(".jeongsi-group-button");
      if (groupButton) {
        assignJeongsiGroup(groupButton.dataset.selectionKey, groupButton.dataset.group);
        return true;
      }
      const clearButton = event.target.closest(".jeongsi-slot-clear");
      if (clearButton) {
        clearJeongsiGroup(clearButton.dataset.group);
        return true;
      }
      const removeButton = event.target.closest(".jeongsi-candidate-remove");
      if (removeButton) {
        removeJeongsiCandidate(removeButton.dataset.selectionKey);
        return true;
      }
      const sortButton = event.target.closest(".jeongsi-sort-button");
      if (sortButton) {
        jeongsiSort = sortButton.dataset.sort === "percentile" ? "percentile" : "added";
        renderApplicationSelections();
        return true;
      }
      if (event.target.closest(".jeongsi-reset-button")) {
        resetJeongsiSelections();
        return true;
      }
      const candidate = event.target.closest(".jeongsi-candidate-main");
      if (candidate) {
        const key = candidate.dataset.selectionKey;
        expandedJeongsiKey = expandedJeongsiKey === key ? null : key;
        renderApplicationSelections();
        return true;
      }
      return false;
    }

        grade: studentGrade.value.trim(),
        className: studentClass.value.trim(),

        const saved = JSON.parse(localStorage.getItem(studentProfileStorageKey) || "{}");
        studentGrade.value = typeof saved.grade === "string" ? saved.grade : "";
        studentClass.value = typeof saved.className === "string" ? saved.className : "";

    }

    function exportApplicationsToExcel() {
      const profile = studentProfile();
      const requiredInputs = [studentGrade, studentClass, studentNumber, studentName];
      const missingInput = requiredInputs.find(input => !input.value.trim());
      if (missingInput) {
        alert("학년, 반, 번호, 이름을 모두 입력해주세요.");
        missingInput.focus();
        return;
      }
      if (!window.XLSX) {
        alert("Excel 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.");
        return;
      }

      const generalSelections = applicationSelections.filter(item => !isSpecialPurposeSelection(item));
      const specialSelections = applicationSelections.filter(isSpecialPurposeSelection);
      const studentSummary = `${profile.grade}학년　　${profile.className}반　　${profile.number}번　　${profile.name}`;
      const rows = [
        [""],
        ["", "지원 희망", "", "", "", studentSummary],
        [""]
      ];
      const merges = [XLSX.utils.decode_range("B2:E2"), XLSX.utils.decode_range("F2:L2")];
      const rowHeights = [{ hpt: 9 }, { hpt: 30 }, { hpt: 14 }];
      const groupHeadingRows = [];
      const applicationBlocks = [];
      const rankColors = ["E9F0DC", "FFFACD", "E7E1EF", "FCE4D6", "DDEBF7", "E2F0D9"];

      const addGroupHeading = title => {
        const rowNumber = rows.length + 1;
        rows.push(["", title]);
        groupHeadingRows.push(rowNumber);
        merges.push(XLSX.utils.decode_range(`B${rowNumber}:L${rowNumber}`));
        rowHeights.push({ hpt: 22 });
      };

      const addApplicationBlock = (item, rankLabel, rankColor) => {
        const startRow = rows.length + 1;
        applicationBlocks.push({ startRow, rankColor });
        rows.push(
          ["", rankLabel, "대학명", "단과대학", "학과명", "정시참고자료\n(6월모평기준)", "군(모집인원)", "표준점수", "백분위", "반영지표", "반영영역", "영어반영"],
          ["", "", item.university || "", item.college || "", item.department || "", "", "", "", "", "", "", ""],
          ["", "전형유형", "세부전형명", "모집인원", "전형방법", "", "", "경쟁률", "수능최저", "", "등급컷", ""],
          [
            "",
            item.admissionType || "",
            item.detailedAdmission || "",
            item.recruitmentCount || "",
            item.method || "", "", "",
            item.competitionRate || "",
            item.csatMinimum || "", "",
            item.gradeCut || "", ""
          ],
          [""]
        );
        merges.push(
          XLSX.utils.decode_range(`B${startRow}:B${startRow + 1}`),
          XLSX.utils.decode_range(`F${startRow}:F${startRow + 1}`),
          XLSX.utils.decode_range(`E${startRow + 2}:G${startRow + 2}`),
          XLSX.utils.decode_range(`E${startRow + 3}:G${startRow + 3}`),
          XLSX.utils.decode_range(`I${startRow + 2}:J${startRow + 2}`),
          XLSX.utils.decode_range(`I${startRow + 3}:J${startRow + 3}`),
          XLSX.utils.decode_range(`K${startRow + 2}:L${startRow + 2}`),
          XLSX.utils.decode_range(`K${startRow + 3}:L${startRow + 3}`)
        );
        rowHeights.push({ hpt: 23 }, { hpt: 23 }, { hpt: 21 }, { hpt: 42 }, { hpt: 28 });
      };

      const specialPurposeCategory = university => {
        const scienceInstitutes = new Set([
          "한국과학기술원", "울산과학기술원", "광주과학기술원", "대구경북과학기술원", "한국에너지공과대학교"
        ]);
        const militaryAcademies = new Set([
          "육군사관학교", "공군사관학교", "해군사관학교", "국군간호사관학교"
        ]);
        const baseName = baseUniversityName(university);
        if (scienceInstitutes.has(baseName)) return "과기원";
        if (militaryAcademies.has(baseName)) return "사관학교";
        return "전통대학";
      };

      const rankedGeneralSelections = generalSelections.slice(0, 6);
      const overLimitGeneralSelections = generalSelections.slice(6);
      if (rankedGeneralSelections.length) {
        addGroupHeading("일반대학 · 1~6지망");
        rankedGeneralSelections.forEach((item, index) => addApplicationBlock(item, `${index + 1}　지망`, rankColors[index]));
      }
      if (overLimitGeneralSelections.length) {
        addGroupHeading("일반대학 · 순위 초과");
        overLimitGeneralSelections.forEach((item, index) => addApplicationBlock(item, `순위 초과 ${index + 1}`, "F4CCCC"));
      }
      if (specialSelections.length) {
        addGroupHeading("특수목적대학");
        specialSelections.forEach(item => addApplicationBlock(item, specialPurposeCategory(item.university), "D9EAF7"));
      }
      if (!applicationSelections.length) {
        addGroupHeading("선택한 대학이 없습니다.");
      }

      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      worksheet["!merges"] = merges;
      worksheet["!rows"] = rowHeights;
      worksheet["!cols"] = [
        3, 14, 23, 20, 23, 18, 15, 12, 12, 12, 12, 12
      ].map(wch => ({ wch }));

      const thinBorder = {
        top: { style: "thin", color: { rgb: "000000" } },
        bottom: { style: "thin", color: { rgb: "000000" } },
        left: { style: "thin", color: { rgb: "000000" } },
        right: { style: "thin", color: { rgb: "000000" } }
      };
      const mediumBorderSide = { style: "medium", color: { rgb: "000000" } };
      const ensureCell = (row, column) => {
        const address = XLSX.utils.encode_cell({ r: row - 1, c: column - 1 });
        if (!worksheet[address]) worksheet[address] = { t: "s", v: "" };
        return worksheet[address];
      };
      const styleRange = (startRow, endRow, startColumn, endColumn, style) => {
        for (let row = startRow; row <= endRow; row += 1) {
          for (let column = startColumn; column <= endColumn; column += 1) {
            ensureCell(row, column).s = style;
          }
        }
      };
      const setBorderSide = (row, column, side, borderSide = mediumBorderSide) => {
        const cell = ensureCell(row, column);
        cell.s = {
          ...(cell.s || {}),
          border: { ...((cell.s && cell.s.border) || {}), [side]: borderSide }
        };
      };
      const whiteCellStyle = {
        font: { name: "맑은 고딕", sz: 10, color: { rgb: "000000" } },
        fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
        alignment: { horizontal: "center", vertical: "center", wrapText: true },
        border: thinBorder
      };
      const headerCellStyle = {
        ...whiteCellStyle,
        font: { name: "맑은 고딕", sz: 10, bold: true, color: { rgb: "000000" } }
      };
      styleRange(2, 2, 2, 5, {
        font: { name: "맑은 고딕", sz: 22, color: { rgb: "5B3F8C" } },
        fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
        alignment: { horizontal: "left", vertical: "center" }
      });
      styleRange(2, 2, 6, 12, {
        font: { name: "맑은 고딕", sz: 12, bold: true, color: { rgb: "000000" } },
        fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
        alignment: { horizontal: "right", vertical: "center" }
      });
      groupHeadingRows.forEach(row => {
        styleRange(row, row, 2, 12, {
          ...headerCellStyle,
          fill: { patternType: "solid", fgColor: { rgb: "DDEBE7" } },
          alignment: { horizontal: "left", vertical: "center" }
        });
      });
      applicationBlocks.forEach(({ startRow, rankColor }) => {
        styleRange(startRow, startRow + 3, 2, 12, whiteCellStyle);
        styleRange(startRow, startRow, 3, 12, headerCellStyle);
        styleRange(startRow + 2, startRow + 2, 2, 12, headerCellStyle);
        styleRange(startRow, startRow + 1, 2, 2, {
          ...whiteCellStyle,
          font: { name: "맑은 고딕", sz: 14, color: { rgb: "000000" } },
          fill: { patternType: "solid", fgColor: { rgb: rankColor } },
          alignment: { horizontal: "center", vertical: "center", wrapText: false }
        });
        for (let column = 2; column <= 12; column += 1) {
          setBorderSide(startRow, column, "top");
          setBorderSide(startRow + 1, column, "bottom");
          setBorderSide(startRow + 3, column, "bottom");
        }
        for (let row = startRow; row <= startRow + 3; row += 1) {
          setBorderSide(row, 2, "left");
          setBorderSide(row, 12, "right");
        }
        setBorderSide(startRow, 2, "right");
        setBorderSide(startRow + 1, 2, "right");
        setBorderSide(startRow, 5, "right");
        setBorderSide(startRow + 1, 5, "right");
      });
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "원서현황");
      workbook.Props = { Title: "수시 원서 희망 현황", Subject: `${profile.name} 학생 대입 지원 희망 목록` };

      const studentId = `${profile.grade}${profile.className}${profile.number.padStart(2, "0")}`;
      const safeName = profile.name.replace(/[\\/:*?"<>|]/g, "_");
      XLSX.writeFile(workbook, `${studentId}_${safeName}_수시원서희망.xlsx`, { compression: true, cellStyles: true });
    }

          <h2>지원 기본정보</h2>
          <table class="print-report-table">
            <colgroup><col style="width:4%"><col style="width:11%"><col style="width:7%"><col style="width:14%"><col style="width:9%"><col style="width:10%"><col style="width:6%"><col style="width:17%"><col style="width:9%"><col style="width:6%"><col style="width:7%"></colgroup>
            <thead><tr><th>순위</th><th>대학명</th><th>단과대학</th><th>지원학과</th><th>전형유형</th><th>세부전형명</th><th>선발인원</th><th>전형방법</th><th>수능최저</th><th>등급컷</th><th>경쟁률</th></tr></thead>

              ${groupedRows(specialSelections, "특수목적대학", "special", 11, basicRow, () => "별도")}

    function printApplicationsToPdf() {
      saveStudentProfile();
      buildApplicationPrintReport();
      const profile = studentProfile();
      const originalTitle = document.title;
      const studentId = `${profile.grade}${profile.className}${profile.number.padStart(2, "0")}`;
      const safeName = profile.name.replace(/[\\/:*?"<>|]/g, "_");
      document.title = `${studentId}_${safeName}_수시원서희망`;

    function renderApplicationSelections() {
      updateApplicationModeControls();
      if (applicationMode === "jeongsi") {
        renderJeongsiSelections();
        return;
      }
      const generalSelections = applicationSelections.filter(item => !isSpecialPurposeSelection(item));
      const specialSelections = applicationSelections.filter(isSpecialPurposeSelection);
      applicationCount.textContent = `전체 ${applicationSelections.length}개`;

      const detailInput = (item, field, placeholder, multiline = false) => {
        const attributes = `class="application-detail-input" data-selection-key="${escapeHtml(item.key)}" data-field="${field}" placeholder="${placeholder}" aria-label="${placeholder}"`;
        return multiline
          ? `<textarea ${attributes} rows="1">${escapeHtml(item[field] || "")}</textarea>`
          : `<input ${attributes} type="text" value="${escapeHtml(item[field] || "")}">`;
      };

      if (!applicationSelections.some(item => item.key === selectedSusiKey)) {
        selectedSusiKey = (generalSelections[0] || specialSelections[0])?.key || null;
      }

      const tableHeader = `
        <div class="application-table-header" aria-hidden="true">
          <span>순서</span><span>대학명</span><span>지원학과</span><span>전형유형</span><span>세부전형명</span>
        </div>`;

      const renderItems = (items, specialPurpose = false) => items.length
        ? items.map((item, index) => {
          const rank = specialPurpose ? "" : `<span class="application-rank${index >= 6 ? " over-limit" : ""}">${index < 6 ? index + 1 : "초과"}</span>`;
          const admissionUrl = admissionLinks[item.university] || admissionLinks[baseUniversityName(item.university)] || "";
          const admissionGuide = admissionUrl
            ? `<a class="susi-guide-link" href="${escapeHtml(admissionUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(`${item.university} 모집요강 열기`)}">모집요강</a>`
            : `<span class="susi-guide-link missing" aria-label="모집요강 링크 없음">요강 없음</span>`;
          const orderControls = `
            ${rank}
            <div class="application-order-controls" aria-label="${escapeHtml(`${item.university} 순서 변경`)}">
              <button class="application-order-button" type="button" data-selection-key="${escapeHtml(item.key)}" data-direction="up" aria-label="위로 이동" ${index === 0 ? "disabled" : ""}>▲</button>
              <button class="application-order-button" type="button" data-selection-key="${escapeHtml(item.key)}" data-direction="down" aria-label="아래로 이동" ${index === items.length - 1 ? "disabled" : ""}>▼</button>
            </div>`;
          return `
        <div class="application-selection-item application-table-row${specialPurpose ? " special-purpose" : " general-purpose"}${item.key === selectedSusiKey ? " selected" : ""}" data-selection-key="${escapeHtml(item.key)}">
          ${orderControls}
          <div class="application-university-cell"><div class="application-university-name"><strong>${escapeHtml(item.university)}</strong><small>${escapeHtml(item.college)}</small></div>${admissionGuide}<button class="application-university-remove-button" type="button" data-selection-key="${escapeHtml(item.key)}" aria-label="${escapeHtml(`${item.university} ${item.department} 삭제`)}">×</button></div>
          ${detailInput(item, "department", "지원학과")}
          ${detailInput(item, "admissionType", "예: 학생부종합")}
          ${detailInput(item, "detailedAdmission", "예: 학업우수형")}
        </div>
      `;
        }).join("")
        : `<div class="application-selection-empty"><p>선택한 대학이 없습니다.</p></div>`;

      const directInput = name => `<input class="application-detail-input" name="${name}" type="text" placeholder="${name === "admissionType" ? "전형유형" : "세부전형명"}" aria-label="${name === "admissionType" ? "전형유형" : "세부전형명"}">`;

        <form class="application-direct-add-form application-table-row" data-category="${category}" hidden>

            <button class="application-direct-add-close" type="button" aria-label="직접추가 입력란 닫기">×</button>

          <input class="application-detail-input" name="university" type="text" placeholder="대학교명" aria-label="대학교명" required>
          <input class="application-detail-input" name="department" type="text" placeholder="지원학과" aria-label="지원학과" required>
          ${directInput("admissionType")}
          ${directInput("detailedAdmission")}
        </form>`;

      applicationSelectionList.innerHTML = `
        <div class="susi-layout">
        <div class="susi-tables">
        <section class="application-selection-section" aria-labelledby="generalUniversityTitle">
          <div class="application-selection-section-heading">
            <h3 id="generalUniversityTitle">일반대학</h3>

              <span>${generalSelections.length}개</span>

            </div>
          </div>
          <div class="application-table-scroll"><div class="application-table-content">${tableHeader}<div class="application-selection-items">${renderItems(generalSelections)}${renderDirectAddRow("general")}</div></div></div>
        </section>
        <section class="application-selection-section" aria-labelledby="specialUniversityTitle">
          <div class="application-selection-section-heading">
            <h3 id="specialUniversityTitle">특수목적대학</h3>
            <div class="application-selection-section-actions">
              <span>수시 6회 외 별도 지원 · ${specialSelections.length}개</span>
              <button class="application-direct-add-toggle" type="button" data-category="special">직접추가</button>
              <button class="application-selection-reset-button" type="button" data-category="special" ${specialSelections.length ? "" : "disabled"}>초기화</button>
            </div>
          </div>
          <div class="application-table-scroll"><div class="application-table-content">${tableHeader}<div class="application-selection-items">${renderItems(specialSelections, true)}${renderDirectAddRow("special")}</div></div></div>
        </section>
        </div>
        <div id="susiDetailPanel" class="susi-detail" role="region" aria-label="선택한 대학 세부 정보"></div>
        </div>
      `;
      renderSusiDetailPanel();
    }

      if (!panel) return;
      const item = applicationSelections.find(selection => selection.key === selectedSusiKey);
      if (!item) {
        panel.innerHTML = `<p class="susi-detail-empty">표에서 대학을 고르면 이곳에 세부 정보를 입력할 수 있습니다.</p>`;
        return;
      }
      const field = (name, label, multiline = false) => {
        const attributes = `class="application-detail-input" data-selection-key="${escapeHtml(item.key)}" data-field="${name}" placeholder="${label}"`;
        const control = multiline
          ? `<textarea ${attributes} rows="3">${escapeHtml(item[name] || "")}</textarea>`
          : `<input ${attributes} type="text" value="${escapeHtml(item[name] || "")}">`;
        return `<label class="susi-detail-field${multiline ? " wide" : ""}"><span>${label}</span>${control}</label>`;
      };
      panel.innerHTML = `
        <div class="susi-detail-heading">
          <small>세부 정보</small>
          <strong>${escapeHtml(item.university)}</strong>

    function addApplicationSelection(button) {
      const university = button.dataset.university;
      const college = button.dataset.college;
      const department = button.dataset.department;
      const key = applicationSelectionKey(university, college, department);
      if (button.dataset.target === "jeongsi") {
        if (!jeongsiCandidates.some(item => item.key === key)) {
          jeongsiCandidates.push({ key, university, college, department });
          saveJeongsiSelections();
        }
      } else if (!applicationSelections.some(item => item.key === key)) {
        applicationSelections.push({ key, university, college, department });
        saveApplicationSelections();
      }
      button.textContent = `${button.dataset.label} ✓`;
      button.classList.add("selected");
      button.setAttribute("aria-pressed", "true");
      renderApplicationSelections();

    function addDirectApplicationSelection(form) {
      const formData = new FormData(form);
      const university = String(formData.get("university") || "").trim();
      const college = String(formData.get("college") || "").trim() || "단과대 구분 없음";
      const department = String(formData.get("department") || "").trim();
      const category = form.dataset.category === "special" ? "special" : "general";
      if (!university || !department) return;
      const key = applicationSelectionKey(university, college, department);
      const existing = applicationSelections.find(item => item.key === key);
      if (existing) {
        existing.category = category;
        applicationDetailFields.forEach(field => {
          if (formData.has(field)) existing[field] = String(formData.get(field) || "").trim();
        });
      } else {
        const newSelection = { key, university, college, department, category };
        applicationDetailFields.forEach(field => {
          newSelection[field] = String(formData.get(field) || "").trim();
        });
        applicationSelections.push(newSelection);
      }
      selectedSusiKey = key;
      saveApplicationSelections();
      renderApplicationSelections();
    }

    function moveApplicationSelection(key, direction) {
      const selected = applicationSelections.find(item => item.key === key);
      if (!selected) return;
      const specialPurpose = isSpecialPurposeSelection(selected);
      const groupedSelections = applicationSelections.filter(item => isSpecialPurposeSelection(item) === specialPurpose);
      const currentIndex = groupedSelections.findIndex(item => item.key === key);
      const targetIndex = direction === "up" ? currentIndex - 1 : currentIndex + 1;
      if (currentIndex < 0 || targetIndex < 0 || targetIndex >= groupedSelections.length) return;
      const current = groupedSelections[currentIndex];
      const target = groupedSelections[targetIndex];
      const currentStorageIndex = applicationSelections.findIndex(item => item.key === current.key);
      const targetStorageIndex = applicationSelections.findIndex(item => item.key === target.key);
      [applicationSelections[currentStorageIndex], applicationSelections[targetStorageIndex]] = [applicationSelections[targetStorageIndex], applicationSelections[currentStorageIndex]];
      saveApplicationSelections();
      renderApplicationSelections();
    }

    function updateApplicationDetail(key, field, value) {
      if (field !== "department" && !applicationDetailFields.includes(field)) return;
      const item = applicationSelections.find(selection => selection.key === key);
      if (!item) return;
      item[field] = value;
      saveApplicationSelections();
    }

    function removeApplicationSelection(key) {
      const index = applicationSelections.findIndex(item => item.key === key);
      if (index < 0) return;
      applicationSelections.splice(index, 1);
      saveApplicationSelections();
      renderApplicationSelections();
      if (state.selectedUniversity) renderDepartmentPanel(state.selectedUniversity);

    function resetApplicationSelections(category) {
      const specialPurpose = category === "special";
      const selectionCount = applicationSelections.filter(item => isSpecialPurposeSelection(item) === specialPurpose).length;
      if (!selectionCount) return;
      const categoryLabel = specialPurpose ? "특수목적대학" : "일반대학";
      if (!window.confirm(`${categoryLabel} 원서현황 ${selectionCount}개를 모두 초기화할까요?`)) return;
      for (let index = applicationSelections.length - 1; index >= 0; index -= 1) {
        if (isSpecialPurposeSelection(applicationSelections[index]) === specialPurpose) applicationSelections.splice(index, 1);
      }
      saveApplicationSelections();
      renderApplicationSelections();
      if (state.selectedUniversity) renderDepartmentPanel(state.selectedUniversity);

    function labelBox(x, y, width, anchor) {
      const left = anchor === "end" ? x - width : anchor === "middle" ? x - width / 2 : x;

    }

    function landmarkLabelBox(x, y, width, anchor, lines, scale = 1) {
      const left = anchor === "end" ? x - width : anchor === "middle" ? x - width / 2 : x;

    // 지도가 기준 크기(100% 배율에서 서울 지도 폭 약 940px)보다 작게 그려질 때 장소 이름을 함께 줄인다.
    function landmarkLabelScale() {
      if (!state.path || !state.mapGeo) return 1;
      const [[x0], [x1]] = state.path.bounds(state.mapGeo);
      const ratio = (x1 - x0) / 940;
      return ratio >= 0.97 ? 1 : clamp(ratio, 0.75, 1);
    }

    function overlapArea(a, b) {
      const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
      const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
      return x * y;
    }

    function paddedBox(box, padding = 4) {
      return { left: box.left - padding, right: box.right + padding, top: box.top - padding, bottom: box.bottom + padding };
    }

    function pointInBox(point, box) {
      return point[0] >= box.left && point[0] <= box.right && point[1] >= box.top && point[1] <= box.bottom;
    }

    function segmentsIntersect(a, b, c, d) {
      const ccw = (p1, p2, p3) => (p3[1] - p1[1]) * (p2[0] - p1[0]) > (p2[1] - p1[1]) * (p3[0] - p1[0]);
      return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
    }

    function segmentIntersectsBox(a, b, box) {
      if (pointInBox(a, box) || pointInBox(b, box)) return true;
      const corners = [[box.left, box.top], [box.right, box.top], [box.right, box.bottom], [box.left, box.bottom]];
      return corners.some((corner, index) => segmentsIntersect(a, b, corner, corners[(index + 1) % corners.length]));
    }

    function routeOverlapPenalty(box) {
      if (!state.activeLine || !state.routes[state.activeLine] || !state.projection) return 0;
      const route = state.routes[state.activeLine].map(coord => state.projection(coord)).filter(point => Number.isFinite(point[0]) && Number.isFinite(point[1]));
      const avoidBox = paddedBox(box, 6);
      for (let i = 1; i < route.length; i++) {
        if (segmentIntersectsBox(route[i - 1], route[i], avoidBox)) return 180;
      }
      return 0;
    }

    function pointOverlapPenalty(box, visiblePoints, ownName) {
      const avoidBox = paddedBox(box, 7);
      return visiblePoints.reduce((sum, point) => {
        if (!pointInBox(point.xy, avoidBox)) return sum;
        return sum + (point.name === ownName ? 700 : 520);
      }, 0);
    }

            return { dx: maxX + 44 - px, dy: minY + index * 22 - py, anchor: "start" };

        }
      }
      const focusDistricts = new Set(["\uacbd\uc0b0\uc2dc", "\ubd80\uc0b0\uc2dc", "\uad11\uc8fc\uc2dc"]);
      if (!focusDistricts.has(d.district)) return null;
      const peers = activeUniversities()
        .filter(item => item.district === d.district)
        .slice()
        .sort((a, b) => b.lat - a.lat || a.lon - b.lon || a.name.localeCompare(b.name));
      if (peers.length < 2) return null;
      const centerLon = d3.mean(peers, item => item.lon);
      const side = d.lon < centerLon ? "left" : "right";
      const sidePeers = peers.filter(item => (item.lon < centerLon ? "left" : "right") === side);
      const sideIndex = sidePeers.findIndex(item => item.name === d.name);
      const index = sideIndex >= 0 ? sideIndex : peers.findIndex(item => item.name === d.name);
      const distance = d.district === "\ubd80\uc0b0\uc2dc" ? 52 : 48;
      const spacing = d.district === "\ubd80\uc0b0\uc2dc" ? 18 : 20;
      const dy = (index - (sidePeers.length - 1) / 2) * spacing;
      return {
        dx: side === "left" ? -distance : distance,
        dy,
        anchor: side === "left" ? "end" : "start"
      };
    }

    function layoutLandmarkLabels(width, height, scale = 1) {
      const baseCandidates = [
        { dx: 10, dy: -10, anchor: "start" },

        { dx: 74, dy: 34, anchor: "start" },
        { dx: -74, dy: 34, anchor: "end" },
        { dx: 0, dy: -48, anchor: "middle" },
        { dx: 0, dy: 58, anchor: "middle" }
      ];
      const candidates = baseCandidates.map(candidate => ({ ...candidate, dx: candidate.dx * scale, dy: candidate.dy * scale }));
      const placed = [];
      // 작은 화면에서 이름을 줄여 보여줄 때도 서울을 대표하는 장소는 먼저 자리를 잡게 한다.
      const iconicOrder = scale < 1 ? iconicLandmarkNames : [];
      const priority = d => {
        const index = iconicOrder.indexOf(d.name);
        return index < 0 ? iconicOrder.length : index;
      };
      return seoulLandmarks
        .map(d => ({ ...d, xy: landmarkXY(d) }))
        .sort((a, b) => priority(a) - priority(b) || a.xy[1] - b.xy[1] || a.xy[0] - b.xy[0])
        .map(d => {
          const lines = landmarkLabelLines(d);
          const textWidth = landmarkLabelWidth(d, scale);
          if (d.forceLabel && scale === 1) {
            const x = clamp(d.xy[0] + (d.dx || 8) * scale, 12, width - 12);
            const y = clamp(d.xy[1] + (d.dy || -8) * scale, 18, height - 12);
            const anchor = d.anchor || "start";
            const box = landmarkLabelBox(x, y, textWidth, anchor, lines, scale);
            const fixed = { ...d, labelX: x, labelY: y, anchor, box, score: -1 };
            placed.push({ box });
            return fixed;
          }
          const candidateSet = d.dx || d.dy ? [{ dx: (d.dx || 8) * scale, dy: (d.dy || -8) * scale, anchor: d.anchor || "start" }, ...candidates] : candidates;
          let best = null;
          candidateSet.forEach((candidate, index) => {
            const x = clamp(d.xy[0] + candidate.dx, 12, width - 12);
            const y = clamp(d.xy[1] + candidate.dy, 18, height - 12);
            const box = landmarkLabelBox(x, y, textWidth, candidate.anchor, lines, scale);
            const boundsPenalty =
              Math.max(0, 12 - box.left) * 16 +
              Math.max(0, box.right - (width - 12)) * 16 +
              Math.max(0, 12 - box.top) * 16 +
              Math.max(0, box.bottom - (height - 12)) * 16;
            const overlapPenalty = placed.reduce((sum, item) => sum + overlapArea(box, item.box) * 80, 0);
            const pointPenalty = seoulLandmarks.reduce((sum, item) => {
              const xy = state.projection([item.lon, item.lat]);
              return sum + (item.name !== d.name && pointInBox(xy, paddedBox(box, 5)) ? 520 : 0);
            }, 0);
            const distancePenalty = Math.hypot(candidate.dx, candidate.dy) * 0.14 + index * 0.18;
            const score = boundsPenalty + overlapPenalty + pointPenalty + distancePenalty;
            if (!best || score < best.score) best = { ...d, labelX: x, labelY: y, anchor: candidate.anchor, box, score };
          });
          // 작은 화면에서는 다른 이름과 겹칠 수밖에 없는 이름을 숨기고 점만 남긴다(마우스를 올리면 이름이 보임).
          if (scale < 1 && placed.some(item => overlapArea(paddedBox(best.box, 4), item.box) > 0)) return null;
          placed.push({ box: best.box });
          return best;
        })
        .filter(Boolean);
    }

          .attr("display", d => visible && labeledNames.has(d.name) ? null : "none")
