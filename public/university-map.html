      const insideSigns = new Set(["고성군", "예천군", "의성군", "청송군", "성주군", "거창군", "함양군", "산청군", "하동군", "봉화군", "영천시", "청도군", "합천군", "의령군", "창녕군", "밀양시", "영양군"]);
      if (insideSigns.has(name)) {
        return at(0.50, 0.50);
      }
      const preferred = {
        "\uacbd\uc0b0\uc2dc": [at(0.50, 0.14), at(0.18, 0.50), at(0.82, 0.50), at(0.50, 0.86)],
        "\ubd80\uc0b0\uc2dc": [at(0.50, 0.14), at(0.84, 0.18), at(0.16, 0.82), at(0.50, 0.86)],
        "\uad11\uc8fc\uc2dc": [at(0.50, 0.14), at(0.50, 0.86), at(0.14, 0.50), at(0.86, 0.50)]
      };
      const activePoints = currentFiltered()
        .filter(activeMatch)
        .map(d => ({ point: pointXY(d), label: d._label?.box }))
        .filter(item => Number.isFinite(item.point[0]) && Number.isFinite(item.point[1]));
      const candidates = [
        ...(preferred[name] || []),
        { x: clampX(cx), y: clampY(cy) },
        at(0.50, 0.50),
        at(0.30, 0.30),
        at(0.70, 0.30),
        at(0.30, 0.70),
        at(0.70, 0.70)
      ];
      let best = null;
      candidates.forEach((candidate, index) => {
        const box = signBoxAt(candidate.x, candidate.y, boxWidth, boxHeight);
        const padded = paddedBox(box, 6);
        const pointPenalty = activePoints.reduce((sum, item) => sum + (pointInBox(item.point, padded) ? 900 : 0), 0);
        const labelPenalty = activePoints.reduce((sum, item) => sum + (item.label ? overlapArea(padded, paddedBox(item.label, 2)) * 20 : 0), 0);
        const boundsPenalty =
          Math.max(0, x0 - box.left) * 6 +
          Math.max(0, box.right - x1) * 6 +
          Math.max(0, y0 - box.top) * 6 +
          Math.max(0, box.bottom - y1) * 6;
        const centerPenalty = Math.hypot(candidate.x - cx, candidate.y - cy) * 0.03;
        const score = pointPenalty + labelPenalty + boundsPenalty + centerPenalty + index * 8;
        if (!best || score < best.score) best = { ...candidate, score };
      });
      return best || { x: clampX(cx), y: clampY(cy) };
    }

    function featureCollection(features) {

    function boundaryLinesFromFeatures(features) {
      const segmentMap = new Map();
      const roundedPoint = point => `${Number(point[0]).toFixed(6)},${Number(point[1]).toFixed(6)}`;
      const segmentKey = (a, b) => {
        const first = roundedPoint(a);
        const second = roundedPoint(b);
        return first < second ? `${first}|${second}` : `${second}|${first}`;
      };
      features.forEach(feature => {
        featurePolygons(feature).forEach(polygon => {
          polygon.forEach(ring => {
            for (let i = 0; i < ring.length - 1; i++) {
              const a = ring[i];
              const b = ring[i + 1];
              const key = segmentKey(a, b);
              const current = segmentMap.get(key);
              if (current) {
                current.count += 1;
              } else {
                segmentMap.set(key, { count: 1, coordinates: [a, b] });
              }
            }
          });
        });
      });
      return {
        type: "FeatureCollection",
        features: [...segmentMap.values()]
          .filter(segment => segment.count === 1)
          .map(segment => ({
            type: "Feature",
            properties: {},
            geometry: { type: "LineString", coordinates: segment.coordinates }
          }))
      };
    }

    function jeollaMainlandFeatures() {
      return (state.geos.jeolla?.features || [])
        .filter(feature => feature?.properties?.province !== "제주")
        .map(feature => {
          const geometry = feature.geometry;
          if (geometry?.type !== "MultiPolygon") return feature;
          const areas = geometry.coordinates.map(polygonBoundsArea);
          const largestIndex = areas.reduce((bestIndex, area, index) => area > areas[bestIndex] ? index : bestIndex, 0);
          const polygons = geometry.coordinates.filter((polygon, index) => index === largestIndex || areas[index] >= 0.008);
          return {
            ...feature,
            geometry: {
              ...geometry,
              coordinates: polygons.length ? polygons : [geometry.coordinates[0]]
            }
          };
        });
    }

    }

    function spreadInsetPoints(points, width, height, minDistance = 18) {
      for (let iteration = 0; iteration < 80; iteration++) {
        let adjusted = false;
        for (let i = 0; i < points.length; i++) {
          for (let j = i + 1; j < points.length; j++) {
            const a = points[i];
            const b = points[j];
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let distance = Math.hypot(dx, dy);
            if (distance >= minDistance) continue;
            if (distance < 0.01) {
              const angle = (i * 2.399 + j) % (Math.PI * 2);
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              distance = 1;
            }
            const push = (minDistance - distance) / 2 + 0.35;
            const ux = dx / distance;
            const uy = dy / distance;
            a.x = clamp(a.x + ux * push, 12, width - 12);
            a.y = clamp(a.y + uy * push, 18, height - 12);
            b.x = clamp(b.x - ux * push, 12, width - 12);
            b.y = clamp(b.y - uy * push, 18, height - 12);
            adjusted = true;
          }
        }
        if (!adjusted) break;
      }
      return points;
    }

    function insetLabelBox(x, y, width, anchor) {
      const left = anchor === "end" ? x - width : anchor === "middle" ? x - width / 2 : x;
      return { left, right: left + width, top: y - 11, bottom: y + 5 };
    }

    function layoutInsetLabels(points, width, height) {
      const candidates = [
        { dx: 12, dy: -10, anchor: "start" },
        { dx: 12, dy: 16, anchor: "start" },
        { dx: -12, dy: -10, anchor: "end" },
        { dx: -12, dy: 16, anchor: "end" },
        { dx: 0, dy: -25, anchor: "middle" },
        { dx: 0, dy: 32, anchor: "middle" },
        { dx: 30, dy: 0, anchor: "start" },
        { dx: -30, dy: 0, anchor: "end" },
        { dx: 28, dy: -24, anchor: "start" },
        { dx: -28, dy: -24, anchor: "end" },
        { dx: 28, dy: 32, anchor: "start" },
        { dx: -28, dy: 32, anchor: "end" },
        { dx: 52, dy: -4, anchor: "start" },
        { dx: -52, dy: -4, anchor: "end" },
        { dx: 52, dy: 24, anchor: "start" },
        { dx: -52, dy: 24, anchor: "end" }
      ];
      const placed = [];
      return points
        .slice()
        .sort((a, b) => a.y - b.y || a.x - b.x)
        .map(point => {
          const text = labelText(point);
          const textWidth = Math.max(42, text.length * 10.5);
          let best = null;
          candidates.forEach((candidate, index) => {
            const x = clamp(point.x + candidate.dx, 12, width - 12);
            const y = clamp(point.y + candidate.dy, 18, height - 12);
            const box = insetLabelBox(x, y, textWidth, candidate.anchor);
            const boundsPenalty =
              Math.max(0, 10 - box.left) * 18 +
              Math.max(0, box.right - (width - 10)) * 18 +
              Math.max(0, 10 - box.top) * 18 +
              Math.max(0, box.bottom - (height - 10)) * 18;
            const overlapPenalty = placed.reduce((sum, item) => sum + overlapArea(box, item.box) * 18, 0);
            const pointPenalty = points.reduce((sum, item) => {
              if (item.name === point.name) return sum;
              return sum + (pointInBox([item.x, item.y], paddedBox(box, 5)) ? 360 : 0);
            }, 0);
            const distancePenalty = Math.hypot(candidate.dx, candidate.dy) * 0.25 + index * 0.3;
            const score = boundsPenalty + overlapPenalty + pointPenalty + distancePenalty;
            if (!best || score < best.score) best = { ...point, labelX: x, labelY: y, anchor: candidate.anchor, box, score };
          });
          placed.push({ box: best.box });
          return best;
        });
    }

      mini.attr("viewBox", `0 0 ${width} ${height}`).selectAll("*").remove();

      const projection = d3.geoMercator().fitExtent([[30, 26], [width - 30, height - 26]], insetFeature);

      const offset = matched.getBoundingClientRect().top - departmentPanel.getBoundingClientRect().top;

        setDepartmentResultsCollapsed(!departmentResultsCollapsed);
      });
      departmentResults.querySelectorAll(".department-result-button").forEach(button => {
        button.addEventListener("click", event => {
          const university = activeUniversities().find(d => d.name === button.dataset.name);
          if (university) selectUniversity(university, event);
        });
      });
    }

    // 검색창이 오른쪽 칸(작은 화면)에 있을 때, 대학을 고르면 검색 결과를 한 줄로 접어 학과정보 자리를 비워 준다.
    function setDepartmentResultsCollapsed(collapsed) {
      departmentResultsCollapsed = collapsed;
      departmentResults.classList.toggle("collapsed", collapsed);
      const toggle = departmentResults.querySelector(".department-results-toggle");
      if (!toggle) return;
      toggle.setAttribute("aria-expanded", String(!collapsed));
      toggle.querySelector(".department-results-toggle-label").textContent = collapsed ? "▸ 펼치기" : "▾ 접기";
    }

    function currentFiltered() {
      const query = search.value.trim().toLowerCase();
      const departmentQuery = departmentSearch.value.trim().toLowerCase();
      if (["capital", "national"].includes(state.currentRegion) && !query && !departmentQuery && !state.activeFavorite) return [];
      return activeUniversities().filter(d => {
        const universityMatch = universitySearchText(d).includes(query);
        return universityMatch && hasMatchingDepartment(d, departmentQuery) && favoriteMatch(d);
      });
    }

    function handleSearchInput() {
      departmentResultsCollapsed = false;
      if (state.activeFavorite) {
        state.activeFavorite = null;
        renderFavoritePicker();
        renderDefaultPanel();
      }
      applyFilter();
    }

    function applyFilter() {
      const filtered = currentFiltered();
      refreshVisuals(filtered);
      renderDepartmentResults(filtered);
      if (state.selectedUniversity && activeUniversities().includes(state.selectedUniversity)) {
        renderDepartmentPanel(state.selectedUniversity);
      } else if (state.currentRegion === "gyeonggi") {
        renderDefaultPanel();
      }
    }

    function drawSelectedRoute() {
      if (!state.routeLayer || !state.path) return;
      state.routeLayer.selectAll("*").remove();
      if (!state.activeLine) return;
      const coordinates = state.routes[state.activeLine] || [];
      if (coordinates.length < 2) return;
      const feature = { type: "LineString", coordinates };
      state.routeLayer.append("path").datum(feature).attr("class", "subway-halo").attr("d", state.path);
      state.routeLayer.append("path").datum(feature).attr("class", "subway-line").attr("stroke", lineMeta[state.activeLine].color).attr("d", state.path).append("title").text(state.activeLine);
    }

    function drawJejuInset(width, height) {
      if (!["jeolla", "national"].includes(state.currentRegion) || !state.geo) return;
      const jejuFeatures = state.currentRegion === "national"
        ? (state.nationalJejuGeo?.features || [])
        : state.geo.features.filter(isJejuFeature);
      if (!jejuFeatures.length) return;
      const jejuCollection = { type: "FeatureCollection", features: jejuFeatures };
      const boxWidth = state.currentRegion === "national" ? 164 : 210;
      const boxHeight = state.currentRegion === "national" ? 112 : 154;
      const x = state.currentRegion === "national" ? Math.max(18, width - 520) : Math.max(18, width - 410);
      const y = Math.max(48, height - boxHeight - 42);
      const inset = svg.append("g").attr("class", "jeju-inset");
      inset.append("rect")
        .attr("class", "island-inset-frame")
        .attr("x", x)
        .attr("y", y)
        .attr("width", boxWidth)
        .attr("height", boxHeight)
        .attr("rx", 6)
        .attr("ry", 6);
      inset.append("text")
        .attr("class", "island-inset-title")
        .attr("x", x + boxWidth / 2)
        .attr("y", y + 20)
        .text("제주");
      const topPadding = state.currentRegion === "national" ? 30 : 34;
      const sidePadding = state.currentRegion === "national" ? 22 : 18;
      state.jejuInsetProjection = d3.geoMercator().fitExtent([[x + sidePadding, y + topPadding], [x + boxWidth - sidePadding, y + boxHeight - 16]], jejuCollection);
      const insetPath = d3.geoPath(state.jejuInsetProjection);
      inset.selectAll("path")
        .data(jejuFeatures)
        .join("path")
        .attr("class", "region-inset-district")
        .classed("active", d => districtName(d) === state.activeDistrict)
        .attr("d", insetPath)
        .on("click", (event, d) => {
          if (state.currentRegion !== "national") selectDistrict(districtName(d));
        })
        .append("title")
        .text(d => state.currentRegion === "national" ? "제주" : districtName(d));
    }

    function selectLine(line) {
      state.landmarkMode = false;
      state.activeLine = state.activeLine === line ? null : line;
      state.activeDistrict = null;
      state.signOnlyDistrict = null;
      linePicker.selectAll(".line-button").classed("active", d => d === state.activeLine);
      drawSelectedRoute();
      applyFilter();
    }

    function selectDistrict(name) {
      state.signOnlyDistrict = null;
      state.activeDistrict = state.activeDistrict === name ? null : name;
      state.activeLine = null;
      linePicker.selectAll(".line-button").classed("active", false);
      drawSelectedRoute();
      applyFilter();
    }

    function resetMapSelection() {
      const hadSelection = state.activeLine || state.activeDistrict || state.signOnlyDistrict || state.activeFavorite || state.selectedUniversity;
      if (!hadSelection) return;
      state.activeLine = null;
      state.activeDistrict = null;
      state.signOnlyDistrict = null;
      state.activeFavorite = null;
      state.selectedUniversity = null;
      linePicker.selectAll(".line-button").classed("active", false);
      renderFavoritePicker();
      tooltip.classed("visible", false);
      drawSelectedRoute();
      applyFilter();
      renderDefaultPanel();
    }

    function toggleLandmarks() {
      if (state.currentRegion !== "seoul") return;
      state.landmarkMode = !state.landmarkMode;
      if (state.landmarkMode) {
        state.activeLine = null;
        state.activeDistrict = null;
        state.signOnlyDistrict = null;
        state.selectedUniversity = null;
        linePicker.selectAll(".line-button").classed("active", false);
        drawSelectedRoute();
      }
      applyFilter();
    }

    function miniLineSvg(name) {
      const color = lineMeta[name].color;
      return `<svg viewBox="0 0 72 24" aria-hidden="true">
        <line x1="8" y1="12" x2="64" y2="12" stroke="${color}" stroke-width="5" stroke-linecap="round"></line>
        <circle cx="18" cy="12" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"></circle>
        <circle cx="36" cy="12" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"></circle>
        <circle cx="54" cy="12" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"></circle>
      </svg>`;
    }

    function lineBadgeLabel(name) {
      const number = name.match(/^(\d+)호선$/);
      return number ? number[1] : name.slice(0, 2);
    }

    function renderLinePicker() {
      linePicker.selectAll(".line-button")
        .data(Object.keys(lineMeta))
        .join("button")
        .attr("class", "line-button")
        .attr("type", "button")
        .attr("title", d => d)
        .attr("aria-label", d => `${d} 표시`)
        .style("--line-color", d => lineMeta[d].color)
        .html(d => `<span class="line-icon">${miniLineSvg(d)}</span><span class="line-name">${d}</span><span class="line-badge" aria-hidden="true">${lineBadgeLabel(d)}</span>`)
        .on("click", (event, d) => selectLine(d));
      updateLandmarkToggle();
    }

    function renderFavoritePicker() {
      favoritePicker.html(`<p class="favorite-title">즐겨찾기</p>`);
      favoritePicker.selectAll(".favorite-button")
        .data(favoriteGroups)
        .join("button")
        .attr("class", "favorite-button")
        .classed("active", d => d.key === state.activeFavorite)
        .attr("type", "button")
        .attr("aria-pressed", d => d.key === state.activeFavorite ? "true" : "false")
        .attr("aria-label", d => `${d.fullLabel} 표시`)
        .style("--favorite-color", d => d.color)
        .html(d => `<span class="favorite-tab" aria-hidden="true"></span><span class="favorite-label">${d.label}</span>`)
        .on("click", (event, d) => selectFavorite(d.key));
    }

    function selectFavorite(key) {
      if (state.currentRegion !== "national") return;
      state.activeFavorite = state.activeFavorite === key ? null : key;
      search.value = "";
      departmentSearch.value = "";
      departmentResults.classList.remove("visible");
      departmentResults.innerHTML = "";
      state.selectedUniversity = null;
      renderFavoritePicker();
      renderDefaultPanel();
      applyFilter();
    }

    function renderDefaultPanel() {
      if (state.currentRegion === "national") {
        const group = favoriteGroup();
        departmentPanel.innerHTML = `
          <h2>전국 대학 학과정보</h2>
          <p class="meta">서울·경기·강원·충청·영남·호남 권역별 대학 정보를 한 화면에서 확인할 수 있습니다.</p>
          <p class="department-empty">${group ? `${escapeHtml(group.fullLabel)}에 해당하는 대학 스팟이 전국지도에 표시됩니다.` : "학과를 검색하거나 왼쪽 즐겨찾기를 선택하면 해당 대학 스팟이 지도에 표시됩니다."}</p>
        `;

          <h2>수도권 대학 학과정보</h2>

          <p class="department-empty">대학교 검색이나 학과 검색을 하면 해당 대학 스팟이 지도에 표시됩니다.</p>
        `;

          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;

      }
      if (state.currentRegion === "chungcheong") {
        departmentPanel.innerHTML = `
          <h2>충청권 대학 학과정보</h2>
          <p class="meta">충청권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "gyeongsang") {
        departmentPanel.innerHTML = `
          <h2>영남권 대학 학과정보</h2>
          <p class="meta">영남권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "jeolla") {
        departmentPanel.innerHTML = `
          <h2>호남권 대학 학과정보</h2>
          <p class="meta">호남권 대학 목록과 학과정보가 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      if (state.currentRegion === "gyeonggi") {
        departmentPanel.innerHTML = `
          <h2>경기권 대학 학과정보</h2>
          <p class="meta">경기권 대학 목록과 학과정보가 서울 지도와 같은 방식으로 표시됩니다.</p>
          <p class="department-empty">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        `;
        return;
      }
      departmentPanel.innerHTML = `
        <h2>학과정보</h2>
        <p class="meta">지도에서 대학의 점을 클릭하면 해당 대학의 학과정보가 표시됩니다.</p>
        <p class="department-empty">대학교 검색이나 학과 검색으로 지도 위 대학을 좁혀볼 수 있습니다.</p>
      `;
    }

    function updateRegionTabs() {
      regionTabs.forEach(tab => {
        const active = tab.dataset.region === state.currentRegion;
        tab.classList.toggle("active", active);
        tab.classList.toggle("pending", !active);
        if (active) {
          tab.setAttribute("aria-current", "page");
        } else {
          tab.removeAttribute("aria-current");
        }
      });
      linePicker.style("display", state.currentRegion === "seoul" ? null : "none");
      favoritePicker.classed("visible", state.currentRegion === "national");
      renderFavoritePicker();
      mapWrap.classList.toggle("region-gyeonggi", ["gyeonggi", "capital"].includes(state.currentRegion));
      mapWrap.classList.toggle("region-gangwon", state.currentRegion === "gangwon");
      mapWrap.classList.toggle("region-chungcheong", state.currentRegion === "chungcheong");
      mapWrap.classList.toggle("region-gyeongsang", state.currentRegion === "gyeongsang");
      mapWrap.classList.toggle("region-jeolla", state.currentRegion === "jeolla");
      mainEl.classList.toggle("region-chungcheong", ["chungcheong", "gyeongsang", "jeolla"].includes(state.currentRegion));
    }

    function selectRegion(region) {
      closeApplicationStatus();
      if (!state.geos[region] || state.currentRegion === region) return;
      state.currentRegion = region;
      state.geo = state.geos[region];
      state.landmarkMode = false;
      state.activeLine = null;
      state.activeDistrict = null;
      state.signOnlyDistrict = null;
      state.activeFavorite = null;
      state.selectedUniversity = null;
      search.value = "";
      departmentSearch.value = "";
      departmentResults.classList.remove("visible");
      departmentResults.innerHTML = "";
      linePicker.selectAll(".line-button").classed("active", false);
      updateRegionTabs();
      updateLandmarkToggle();
      renderDefaultPanel();
      draw();
    }

    function openApplicationStatus() {
      renderApplicationSelections();
      mainEl.classList.add("application-mode");
      applicationStatusView.hidden = false;
      applicationStatusTab.classList.add("active");
      applicationStatusTab.setAttribute("aria-current", "page");
      regionTabs.forEach(tab => {
        tab.classList.remove("active");
        tab.classList.add("pending");
        tab.removeAttribute("aria-current");
      });
    }

    function closeApplicationStatus() {
      if (applicationStatusView.hidden) return;
      mainEl.classList.remove("application-mode");
      applicationStatusView.hidden = true;
      applicationStatusTab.classList.remove("active");
      applicationStatusTab.removeAttribute("aria-current");
      updateRegionTabs();
    }

    const mapSearchBox = document.querySelector(".map-search");
    const mapSearchAnchor = document.querySelector("#districtInset");
    const wideMapQuery = window.matchMedia("(min-width: 1600px), (max-width: 940px)");

    function layoutMapOverlays() {
      const aside = mainEl.querySelector("aside");
      if (wideMapQuery.matches || !aside) {
        if (mapSearchBox.parentElement !== mapWrap) mapWrap.insertBefore(mapSearchBox, mapSearchAnchor);
      } else if (mapSearchBox.parentElement !== aside) {
        aside.prepend(mapSearchBox);
      }
      mapSearchBox.classList.toggle("in-aside", mapSearchBox.parentElement === aside);
      const picker = linePicker.node();
      if (landmarkPanel && picker && picker.getClientRects().length) {
        landmarkPanel.style.top = `${picker.offsetTop + picker.offsetHeight + 8}px`;
      } else if (landmarkPanel) {
        landmarkPanel.style.top = "";
      }
    }

    if (window.ResizeObserver) {
      new ResizeObserver(() => {
        const picker = linePicker.node();
        if (landmarkPanel && picker && picker.getClientRects().length) {
          landmarkPanel.style.top = `${picker.offsetTop + picker.offsetHeight + 8}px`;
        }
      }).observe(linePicker.node());
    }

    function mapLeftOverlayEdge() {
      return [linePicker.node(), favoritePicker.node()]
        .filter(element => element && element.getClientRects().length)
        .reduce((edge, element) => Math.max(edge, element.offsetLeft + element.offsetWidth + 12), 0);
    }

    function draw() {
      if (!state.geo) return;
      layoutMapOverlays();
      const node = svg.node();
      const width = node.clientWidth || 900;
      const height = node.clientHeight || 620;
      const currentUniversities = activeUniversities();
      svg.attr("viewBox", `0 0 ${width} ${height}`);
      svg.selectAll("*:not(title):not(desc)").remove();

      const fitPadding = state.currentRegion === "gyeonggi" ? 34 : 30;
      const mapGeo = displayGeo();
      state.mapGeo = mapGeo;
      const fitGeo = gyeonggiFitFeature(mapGeo);
      const fitExtent = state.currentRegion === "national"
        ? [[40, fitPadding - 10], [width - 198, height - fitPadding + 10]]
        : state.currentRegion === "jeolla"
        ? [[-110, fitPadding - 18], [width - 206, height - fitPadding + 16]]
        : ["chungcheong", "gyeongsang"].includes(state.currentRegion)
        ? [[-30, fitPadding], [width - 178, height - fitPadding]]
        : [[fitPadding, fitPadding], [width - fitPadding, height - fitPadding]];
      state.projection = d3.geoMercator().fitExtent(fitExtent, fitGeo);
      const leftOverlayEdge = mapLeftOverlayEdge();
      if (leftOverlayEdge && d3.geoPath(state.projection).bounds(fitGeo)[0][0] < leftOverlayEdge) {
        state.projection = d3.geoMercator().fitExtent([[leftOverlayEdge, fitExtent[0][1]], fitExtent[1]], fitGeo);
      }
      state.path = d3.geoPath(state.projection);
      state.jejuInsetProjection = null;
      preparePointOffsets(currentUniversities);

      svg.append("rect")
        .attr("class", "map-reset-bg")
        .attr("width", width)
        .attr("height", height)
        .attr("fill", "var(--map-water)")
        .on("click", resetMapSelection);
      if (state.currentRegion === "seoul") {
        svg.append("path").datum(riverLine).attr("class", "river").attr("d", state.path);
      }
      state.districts = svg.append("g")
        .selectAll("path")
        .data(mapGeo.features)
        .join("path")
        .attr("class", d => `district${state.currentRegion === "national" ? " national-region" : districtName(d) === "서울" && ["gyeonggi", "capital"].includes(state.currentRegion) ? " seoul-region" : isIncheonDistrictFeature(d) ? " incheon-region" : ["gyeonggi", "capital"].includes(state.currentRegion) ? " gyeonggi-region-part" : ""}`)
        .attr("d", state.path)
        .on("click", (event, d) => {
          event.stopPropagation();
          selectDistrict(districtName(d));
        });
      state.districts.append("title").text(d => districtName(d));
      drawJeollaLandGapPatches();

      if (false && state.currentRegion === "national" && state.nationalBoundary) {
        svg.append("path")
          .datum(state.nationalBoundary)
          .attr("class", "national-boundary")
          .attr("d", state.path);
      }

      state.routeLayer = svg.append("g").attr("aria-label", "선택한 지하철 노선");
      svg.append("path")
        .datum({ type: "FeatureCollection", features: mapGeo.features.filter(d => !(["gyeonggi", "capital"].includes(state.currentRegion) && districtName(d) === "서울")) })
        .attr("class", "seoul-outline")
        .attr("d", state.path);
      state.activeDistrictFill = svg.append("path")
        .attr("class", "active-district-fill")
        .attr("display", "none");
      state.activeDistrictOutline = svg.append("path")
        .attr("class", "active-district-outline")
        .attr("display", "none");
      drawJejuInset(width, height);
      state.landmarkRiver = svg.append("path").datum(riverLine).attr("class", "landmark-river").attr("d", state.path).attr("display", "none");

      state.points = svg.append("g")
        .selectAll("circle")
        .data(currentUniversities, d => d.name)
        .join("circle")
        .attr("class", "uni-point")
        .attr("aria-label", d => `${d.name}, ${d.district}`)
        .attr("cx", d => pointXY(d)[0])
        .attr("cy", d => pointXY(d)[1])
        .attr("r", pointRadius)
        .attr("opacity", dimOpacity)
        .attr("tabindex", 0)
        .on("mouseenter focus", (event, d) => { focusUniversity(d); showTip(event, d); })
        .on("click", (event, d) => {
          event.stopPropagation();
          selectUniversity(d, event);
        })
        .on("mouseleave blur", hideTip);

      state.labelLinks = svg.append("g").attr("aria-label", "대학교 이름 연결선");

      state.labels = svg.append("g")
        .selectAll("text")
        .data(currentUniversities, d => d.name)
        .join("text")
        .attr("class", "label")
        .attr("x", d => pointXY(d)[0] + 7)
        .attr("y", d => pointXY(d)[1] - 7)
        .text(labelText)
        .attr("display", "none");

      state.landmarkPoints = svg.append("g")
        .selectAll("circle")
        .data(seoulLandmarks, d => d.name)
        .join("circle")
        .attr("class", "landmark-point")
        .attr("aria-label", d => `${d.name}, ${d.desc}`)
        .attr("r", 5)
        .attr("tabindex", 0)
        .attr("display", "none")
        .on("mouseenter focus", showLandmarkTip)
        .on("mouseleave blur", () => tooltip.classed("visible", false));

      state.landmarkLinks = svg.append("g").attr("aria-label", "서울에 가면 장소 이름 연결선");

      state.landmarkLabels = svg.append("g")
        .selectAll("text")
        .data(seoulLandmarks, d => d.name)
        .join("text")
        .attr("class", "landmark-label")
        .each(function(d) {
          const text = d3.select(this);
          text.selectAll("tspan")
            .data(landmarkLabelLines(d))
            .join("tspan")
            .text(line => line);
        })
        .attr("display", "none");

      state.districtSign = svg.append("g").attr("class", "district-sign").attr("display", "none");
      state.districtSign.append("line");
      state.districtSign.append("rect").attr("rx", 5).attr("ry", 5);
      state.districtSign.append("text");
      drawSelectedRoute();
      applyFilter();
    }

    Promise.all([
      d3.json(seoulGeoUrl),
      d3.json(gyeonggiGeoUrl),
      d3.json(incheonGeoUrl),
      d3.json(gangwonGeoUrl),
      d3.json(chungcheongGeoUrl),
      d3.json(gyeongsangGeoUrl),
      d3.json(jeollaGeoUrl),
      d3.json(nationalGeoUrl),
      d3.json(nationalBoundaryUrl),
      d3.json(nationalJejuGeoUrl),
      d3.csv(stationCsvUrl).catch(() => [])
    ])
      .then(([seoulGeo, gyeonggiGeoRaw, incheonGeoRaw, gangwonGeo, chungcheongGeo, gyeongsangGeo, jeollaGeo, nationalGeo, nationalBoundary, nationalJejuGeo, stations]) => {
        const gyeonggiGeo = {
          type: "FeatureCollection",
          features: [...gyeonggiGeoRaw.features, ...incheonGeoRaw.features]
        };
        state.geos = { seoul: seoulGeo, gyeonggi: gyeonggiGeo, capital: gyeonggiGeo, gangwon: gangwonGeo, chungcheong: chungcheongGeo, gyeongsang: gyeongsangGeo, jeolla: jeollaGeo, national: rewindNationalGeo(nationalGeo) };
        state.nationalBoundary = nationalBoundary;
        state.nationalJejuGeo = rewindNationalGeo(nationalJejuGeo);
        state.cheonanInternalBoundary = null;
        state.chungcheongOuterBoundaries = null;
        state.geo = state.geos[state.currentRegion];
        state.routes = buildRoutes(stations);
        renderLinePicker();
        updateRegionTabs();
        regionTabs.forEach(tab => {
          tab.addEventListener("click", () => selectRegion(tab.dataset.region));
        });
        applicationStatusTab.addEventListener("click", openApplicationStatus);
        departmentPanel.addEventListener("click", event => {
          const button = event.target.closest(".department-select-button");
          const item = event.target.closest(".department-panel li");
          if (button) {
            addApplicationSelection(button);
            button.blur();
            item.classList.remove("actions-open");
            item.classList.add("actions-confirming");
            window.setTimeout(() => {
              item.classList.remove("actions-confirming");
              item.classList.add("actions-dismissed");
              if (!item.matches(":hover")) window.setTimeout(() => item.classList.remove("actions-dismissed"), 400);
            }, 600);
            return;
          }
          if (!item || !window.matchMedia("(hover: none)").matches) return;
          const open = !item.classList.contains("actions-open");
          departmentPanel.querySelectorAll("li.actions-open").forEach(other => other.classList.remove("actions-open"));
          item.classList.remove("actions-dismissed");
          item.classList.toggle("actions-open", open);
        });
        departmentPanel.addEventListener("mouseout", event => {
          const item = event.target.closest(".department-panel li.actions-dismissed");
          if (item && !item.contains(event.relatedTarget)) item.classList.remove("actions-dismissed");
        });
        applicationModeSwitch.addEventListener("click", event => {
          const option = event.target.closest(".application-mode-option");
          if (option && option.dataset.mode !== applicationMode) setApplicationMode(option.dataset.mode);
        });
        applicationSelectionList.addEventListener("click", event => {
          if (applicationMode === "jeongsi" && handleJeongsiClick(event)) return;
          const orderButton = event.target.closest(".application-order-button");
          if (orderButton) {
            moveApplicationSelection(orderButton.dataset.selectionKey, orderButton.dataset.direction);
            return;
          }
          const closeButton = event.target.closest(".application-direct-add-close");
          if (closeButton) {
            closeButton.closest(".application-direct-add-form").hidden = true;
            return;
          }
          const toggle = event.target.closest(".application-direct-add-toggle");
          if (toggle) {
            const form = toggle.closest(".application-selection-section").querySelector(".application-direct-add-form");
            form.hidden = !form.hidden;
            if (!form.hidden) form.elements.university.focus();
            return;
          }
          const resetButton = event.target.closest(".application-selection-reset-button");
          if (resetButton) {
            resetApplicationSelections(resetButton.dataset.category);
            return;
          }
          const button = event.target.closest(".application-university-remove-button");
          if (button) {
            removeApplicationSelection(button.dataset.selectionKey);
            return;
          }
          const row = event.target.closest(".application-selection-item[data-selection-key]");
          if (row) selectSusiRow(row.dataset.selectionKey);
        });
        applicationSelectionList.addEventListener("submit", event => {
          const form = event.target.closest(".application-direct-add-form");
          if (!form) return;
          event.preventDefault();
          addDirectApplicationSelection(form);
        });
        applicationSelectionList.addEventListener("input", event => {
          const input = event.target.closest(".application-detail-input");
          if (!input || !input.dataset.selectionKey) return;
          updateApplicationDetail(input.dataset.selectionKey, input.dataset.field, input.value);
          if (input.closest(".application-table-row") && input.dataset.selectionKey === selectedSusiKey) {
            const item = applicationSelections.find(selection => selection.key === selectedSusiKey);
            const summary = applicationSelectionList.querySelector(".susi-detail-heading span");
            if (item && summary) summary.textContent = [item.department, item.admissionType, item.detailedAdmission].filter(Boolean).join(" · ");
          }
        });
        applicationSelectionList.addEventListener("focusin", event => {
          if (applicationMode !== "susi") return;
          const row = event.target.closest(".application-selection-item[data-selection-key]");
          if (row) selectSusiRow(row.dataset.selectionKey);
        });
        [studentGrade, studentClass, studentNumber, studentName].forEach(input => {
          input.addEventListener("input", saveStudentProfile);
        });
        excelExportButton.addEventListener("click", exportApplicationsToExcel);
        pdfExportButton.addEventListener("click", printApplicationsToPdf);
        loadStudentProfile();
        loadApplicationSelections();
        loadJeongsiSelections();
        renderApplicationSelections();
        draw();
        window.addEventListener("resize", () => draw());
        search.addEventListener("input", handleSearchInput);
        departmentSearch.addEventListener("input", handleSearchInput);
        if (landmarkToggle) landmarkToggle.addEventListener("click", toggleLandmarks);
        if (state.districtInsetClose) {
          state.districtInsetClose.addEventListener("click", () => {
            state.activeDistrict = null;
            applyFilter();
          });
        }
      })
      .catch(error => {
        console.error(error);
        errorBox.style.display = "grid";
      });
  </script>
</body>
</html>
